<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1426">
<meta name="description" content="Rush Athletic — çocuk ve gençler için atletik performans, yetenek keşfi ve sporcu gelişim platformu">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rush Athletic">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Rush Athletic</title>
<style>
:root{
  --bg:#0B1426; --bg2:#0F1A30; --card:#141E34; --card2:#1A2540; --line:#26324D; --line2:#33405F;
  --ink:#F4F7FB; --ink2:#B9C3D6; --ink3:#8391AB;
  --acc:#22D3C5; --acc2:#3B82F6; --accInk:#04201D;
  --ok:#34D399; --warn:#FBBF24; --bad:#F87171; --info:#60A5FA;
  --okBg:rgba(52,211,153,.12); --warnBg:rgba(251,191,36,.12); --badBg:rgba(248,113,113,.12); --infoBg:rgba(96,165,250,.12); --accBg:rgba(34,211,197,.12);
  --r:16px; --r2:12px; --pad:16px;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  --fs:16px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EEF2F8; --bg2:#E4EAF3; --card:#FFFFFF; --card2:#F3F6FB; --line:#D8E0EC; --line2:#C5D0E0;
  --ink:#0B1426; --ink2:#3A4760; --ink3:#66738C; --accInk:#FFFFFF; --acc:#0E9F94; --acc2:#2563EB;
  --okBg:rgba(5,150,105,.12); --ok:#059669; --warn:#B45309; --warnBg:rgba(217,119,6,.12); --bad:#DC2626; --badBg:rgba(220,38,38,.10); --info:#2563EB; --infoBg:rgba(37,99,235,.10); --accBg:rgba(14,159,148,.12);
  color-scheme:light;
}
:root[data-text="large"]{--fs:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:var(--fs);line-height:1.45;-webkit-text-size-adjust:100%;overflow-x:hidden}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--bg)}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg),rgba(11,20,38,.96));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(var(--safeT) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
:root[data-theme="light"] .topbar{background:rgba(238,242,248,.96)}
.topbar h1{font-size:1.06rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;letter-spacing:.2px}
svg.i{width:22px;height:22px;flex:0 0 auto;vertical-align:middle}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;position:relative}
.iconbtn svg{width:22px;height:22px}
.dot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--card)}
.saveind{font-size:.72rem;color:var(--ink3);white-space:nowrap}
main{padding:14px var(--pad) calc(96px + var(--safeB))}
main.noNav{padding-bottom:calc(32px + var(--safeB))}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:30;background:rgba(15,26,48,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + var(--safeB))}
:root[data-theme="light"] .tabbar{background:rgba(255,255,255,.97)}
.tab{text-decoration:none;flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--ink3);font-size:.68rem;cursor:pointer;border-radius:10px;min-height:52px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--acc)}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
h2{font-size:1.18rem;margin:18px 0 10px}
h3{font-size:1rem;margin:14px 0 8px}
h2:first-child,h3:first-child{margin-top:0}
p{margin:6px 0}
.muted{color:var(--ink3)} .small{font-size:.82rem} .tiny{font-size:.72rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.card.flat{background:var(--card2)}
.card.acc{border-color:rgba(34,211,197,.45);background:linear-gradient(160deg,rgba(34,211,197,.10),var(--card) 60%)}
.card h3{margin-top:0}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;min-width:0}
.stat b{display:block;font-size:1.25rem;line-height:1.2}
.stat span{font-size:.74rem;color:var(--ink3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;text-align:center;max-width:100%}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btn.blue{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn.danger{background:var(--badBg);border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.88rem;border-radius:11px}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1 1 140px}
label.f{display:block;margin:0 0 12px}
label.f>span{display:block;font-size:.84rem;color:var(--ink2);margin-bottom:5px;font-weight:600}
.in,select.in,textarea.in{width:100%;min-height:48px;padding:11px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea.in{min-height:84px;resize:vertical}
.in:focus{border-color:var(--acc)}
.hint{font-size:.76rem;color:var(--ink3);margin-top:4px}
.grid2>*,.grid3>*{min-width:0}
input.in[type=date]{min-width:0;display:block}
.tbl .pill{white-space:normal}
.tbl td{overflow-wrap:anywhere}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;cursor:pointer}
.check input{width:22px;height:22px;flex:0 0 22px;margin:1px 0 0;accent-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card2);font-size:.86rem;cursor:pointer;user-select:none}
.chip input{display:none}
.chip.on,.chip:has(input:checked){background:var(--accBg);border-color:var(--acc);color:var(--acc)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;border:1px solid var(--line2);background:var(--card2);color:var(--ink2);max-width:100%;vertical-align:middle}
.pill.ok{background:var(--okBg);border-color:transparent;color:var(--ok)}
.pill.warn{background:var(--warnBg);border-color:transparent;color:var(--warn)}
.pill.bad{background:var(--badBg);border-color:transparent;color:var(--bad)}
.pill.info{background:var(--infoBg);border-color:transparent;color:var(--info)}
.pill.acc{background:var(--accBg);border-color:transparent;color:var(--acc)}
.alert{border-radius:var(--r2);padding:11px 12px;margin:0 0 12px;font-size:.88rem;border:1px solid transparent}
.alert.ok{background:var(--okBg);border-color:rgba(52,211,153,.35)}
.alert.warn{background:var(--warnBg);border-color:rgba(251,191,36,.35)}
.alert.bad{background:var(--badBg);border-color:rgba(248,113,113,.4)}
.alert.info{background:var(--infoBg);border-color:rgba(96,165,250,.35)}
.alert b.at{display:block;margin-bottom:2px}
.list{display:flex;flex-direction:column;gap:8px}
.li{text-decoration:none;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px;cursor:pointer;min-height:56px;text-decoration:none;color:inherit}
.li .ic{width:40px;height:40px;border-radius:11px;background:var(--accBg);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:0 0 40px;font-weight:800}
.li .ic svg{width:22px;height:22px}
.li .t{font-weight:650}
.li .s{font-size:.8rem;color:var(--ink3)}
.li .chev{color:var(--ink3);flex:0 0 auto}
.menuGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mtile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.76rem;cursor:pointer;min-height:86px;color:var(--ink);text-decoration:none}
.mtile svg{width:26px;height:26px;color:var(--acc)}
.avatar{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04201D;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.25rem;flex:0 0 auto}
.avatar.sm{width:40px;height:40px;border-radius:12px;font-size:.95rem;flex-basis:40px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.tbl{width:100%;border-collapse:collapse;font-size:.84rem}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{color:var(--ink3);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.3px}
.tbl td.r,.tbl th.r{text-align:right}
.tblwrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;min-height:40px;border:0;background:none;border-radius:9px;font-size:.84rem;font-weight:600;color:var(--ink3);cursor:pointer;padding:4px}
.seg button.on{background:var(--acc);color:var(--accInk)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink2);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.ex{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;background:var(--card)}
.ex.done{border-color:rgba(52,211,153,.5);background:linear-gradient(150deg,var(--okBg),var(--card) 70%)}
.ex .nm{font-weight:700}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.setb{min-width:46px;height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);font-weight:700;cursor:pointer}
.setb.on{background:var(--ok);border-color:var(--ok);color:#052e1f}
.blockh{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-size:.8rem;font-weight:800;color:var(--acc);text-transform:uppercase;letter-spacing:.6px}
.blockh:after{content:"";flex:1;height:1px;background:var(--line)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:74px;padding:5px 3px;font-size:.66rem;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center}
.day b{font-size:.8rem}
.day.today{border-color:var(--acc)}
.day .ev{width:100%;border-radius:5px;padding:2px 1px;font-weight:700;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.s{background:var(--accBg);color:var(--acc)} .ev.t{background:var(--infoBg);color:var(--info)} .ev.c{background:var(--warnBg);color:var(--warn)} .ev.d{background:var(--okBg);color:var(--ok)}
.timer{font-variant-numeric:tabular-nums;font-size:2.2rem;font-weight:800;text-align:center;letter-spacing:1px}
.ready{display:grid;grid-template-columns:1fr;gap:8px}
.ready button{min-height:52px;border-radius:14px;border:1px solid var(--line2);background:var(--card2);font-weight:650;cursor:pointer;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:1rem}
.ready button.on{border-color:var(--acc);background:var(--accBg)}
.emoji{font-size:1.4rem}
.rpe{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rpe button{min-height:46px;border-radius:11px;border:1px solid var(--line2);background:var(--card2);font-weight:800;cursor:pointer}
.rpe button.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.vwrap{position:relative;width:100%;background:#000;border-radius:14px;overflow:hidden;touch-action:none}
.vwrap video{width:100%;display:block;max-height:60vh;object-fit:contain}
.vwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at 50% 35%,#16305A 0%,#0B1426 62%);transition:opacity .45s}
.splash.hide{opacity:0;pointer-events:none}
.logo{width:88px;height:88px}
.brand{font-size:1.7rem;font-weight:800;letter-spacing:.5px}
.brand em{font-style:normal;color:var(--acc)}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safeB));transform:translateX(-50%);z-index:90;background:#0E1B33;color:#fff;border:1px solid var(--line2);padding:11px 16px;border-radius:12px;font-size:.88rem;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
.sheetbg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:88vh;max-height:88dvh;overflow:auto;background:var(--bg2);border-radius:20px 20px 0 0;padding:18px var(--pad) calc(20px + var(--safeB));border-top:1px solid var(--line2)}
.sheet h2{margin-top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.88rem}
.kv dt{color:var(--ink3)} .kv dd{margin:0;text-align:right;font-weight:600;min-width:0;overflow-wrap:anywhere}
.ring{width:84px;height:84px;flex:0 0 84px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;width:84px;text-align:center;font-size:.7rem;color:var(--ink2)}
.badge .b{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;background:var(--accBg);border:2px solid var(--acc)}
.badge.off .b{filter:grayscale(1);opacity:.35;border-color:var(--line2)}
.hr{height:1px;background:var(--line);margin:14px 0}
.center{text-align:center}
.mt{margin-top:12px}.mb0{margin-bottom:0}
.nowrap{white-space:nowrap}
.scorebar{display:flex;align-items:center;gap:8px;font-size:.82rem;margin:6px 0}
.scorebar .lab{width:110px;flex:0 0 110px;color:var(--ink2)}
.scorebar .bar{flex:1}
.scorebar .v{width:44px;text-align:right;font-weight:700}
details.acc{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px}
details.acc>summary{padding:12px;cursor:pointer;font-weight:650;list-style:none;display:flex;align-items:center;gap:8px;min-height:48px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary:after{content:"›";margin-left:auto;transform:rotate(90deg);color:var(--ink3);font-size:1.3rem;transition:transform .2s}
details.acc[open]>summary:after{transform:rotate(-90deg)}
details.acc>div{padding:0 12px 12px}
.lock{max-width:420px;margin:0 auto;padding:calc(var(--safeT) + 40px) 20px 40px}
.empty{text-align:center;padding:26px 10px;color:var(--ink3)}
.empty svg{width:44px;height:44px;opacity:.6}
#printArea{display:none}
#repPrev .chart text{fill:#333}
#repPrev a{color:#0E9F94}
@media print{
  body{background:#fff!important;color:#111!important}
  #app,.toast,.sheetbg,.splash{display:none!important}
  #printArea{display:block!important;color:#111;font-size:11pt}
  #printArea .pcard{border:1px solid #ccd;border-radius:8px;padding:10px;margin:0 0 10px;break-inside:avoid}
  #printArea h1{font-size:18pt;margin:0 0 4px}
  #printArea h2{font-size:13pt;margin:14px 0 6px;color:#0B1426;border-bottom:2px solid #22D3C5;padding-bottom:3px}
  #printArea table{width:100%;border-collapse:collapse;font-size:9.5pt}
  #printArea th,#printArea td{border-bottom:1px solid #dde;padding:4px;text-align:left}
  #printArea svg text{fill:#333}
  @page{margin:14mm}
}
@media (min-width:521px){ body{background:#070D1A} #app{box-shadow:0 0 0 1px var(--line)} }
</style>
</head>
<body>
<div id="splash" class="splash" aria-hidden="true">
  <svg class="logo" viewBox="0 0 96 96" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3C5"/></linearGradient></defs><rect x="4" y="4" width="88" height="88" rx="24" fill="#0F1A30" stroke="url(#lg)" stroke-width="3"/><path d="M26 64 L42 30 L54 52 L62 40 L72 64" fill="none" stroke="url(#lg)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="62" cy="26" r="6" fill="#22D3C5"/></svg>
  <div class="brand">RUSH <em>ATHLETIC</em></div>
  <div class="muted small">Atletik performans · Yetenek keşfi · Gelişim</div>
</div>
<div id="app"></div>
<div id="printArea"></div>
<div id="toastHost"></div>
<div id="sheetHost"></div>
<script>
"use strict";
