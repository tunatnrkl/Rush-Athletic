<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1426">
<meta name="description" content="Rush Athletic — çocuk ve gençler için atletik performans, yetenek keşfi ve sporcu gelişim platformu">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rush Athletic">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Rush Athletic</title>
<style>
:root{
  --bg:#0B1426; --bg2:#0F1A30; --card:#141E34; --card2:#1A2540; --line:#26324D; --line2:#33405F;
  --ink:#F4F7FB; --ink2:#B9C3D6; --ink3:#8391AB;
  --acc:#22D3C5; --acc2:#3B82F6; --accInk:#04201D;
  --ok:#34D399; --warn:#FBBF24; --bad:#F87171; --info:#60A5FA;
  --okBg:rgba(52,211,153,.12); --warnBg:rgba(251,191,36,.12); --badBg:rgba(248,113,113,.12); --infoBg:rgba(96,165,250,.12); --accBg:rgba(34,211,197,.12);
  --r:16px; --r2:12px; --pad:16px;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  --fs:16px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EEF2F8; --bg2:#E4EAF3; --card:#FFFFFF; --card2:#F3F6FB; --line:#D8E0EC; --line2:#C5D0E0;
  --ink:#0B1426; --ink2:#3A4760; --ink3:#66738C; --accInk:#FFFFFF; --acc:#0E9F94; --acc2:#2563EB;
  --okBg:rgba(5,150,105,.12); --ok:#059669; --warn:#B45309; --warnBg:rgba(217,119,6,.12); --bad:#DC2626; --badBg:rgba(220,38,38,.10); --info:#2563EB; --infoBg:rgba(37,99,235,.10); --accBg:rgba(14,159,148,.12);
  color-scheme:light;
}
:root[data-text="large"]{--fs:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:var(--fs);line-height:1.45;-webkit-text-size-adjust:100%;overflow-x:hidden}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--bg)}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg),rgba(11,20,38,.96));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(var(--safeT) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
:root[data-theme="light"] .topbar{background:rgba(238,242,248,.96)}
.topbar h1{font-size:1.06rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;letter-spacing:.2px}
svg.i{width:22px;height:22px;flex:0 0 auto;vertical-align:middle}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;position:relative}
.iconbtn svg{width:22px;height:22px}
.dot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--card)}
.saveind{font-size:.72rem;color:var(--ink3);white-space:nowrap}
main{padding:14px var(--pad) calc(96px + var(--safeB))}
main.noNav{padding-bottom:calc(32px + var(--safeB))}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:30;background:rgba(15,26,48,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + var(--safeB))}
:root[data-theme="light"] .tabbar{background:rgba(255,255,255,.97)}
.tab{text-decoration:none;flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--ink3);font-size:.68rem;cursor:pointer;border-radius:10px;min-height:52px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--acc)}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
h2{font-size:1.18rem;margin:18px 0 10px}
h3{font-size:1rem;margin:14px 0 8px}
h2:first-child,h3:first-child{margin-top:0}
p{margin:6px 0}
.muted{color:var(--ink3)} .small{font-size:.82rem} .tiny{font-size:.72rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.card.flat{background:var(--card2)}
.card.acc{border-color:rgba(34,211,197,.45);background:linear-gradient(160deg,rgba(34,211,197,.10),var(--card) 60%)}
.card h3{margin-top:0}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;min-width:0}
.stat b{display:block;font-size:1.25rem;line-height:1.2}
.stat span{font-size:.74rem;color:var(--ink3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;text-align:center;max-width:100%}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btn.blue{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn.danger{background:var(--badBg);border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.88rem;border-radius:11px}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1 1 140px}
label.f{display:block;margin:0 0 12px}
label.f>span{display:block;font-size:.84rem;color:var(--ink2);margin-bottom:5px;font-weight:600}
.in,select.in,textarea.in{width:100%;min-height:48px;padding:11px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea.in{min-height:84px;resize:vertical}
.in:focus{border-color:var(--acc)}
.hint{font-size:.76rem;color:var(--ink3);margin-top:4px}
.grid2>*,.grid3>*{min-width:0}
input.in[type=date]{min-width:0;display:block}
.tbl .pill{white-space:normal}
.tbl td{overflow-wrap:anywhere}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;cursor:pointer}
.check input{width:22px;height:22px;flex:0 0 22px;margin:1px 0 0;accent-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card2);font-size:.86rem;cursor:pointer;user-select:none}
.chip input{display:none}
.chip.on,.chip:has(input:checked){background:var(--accBg);border-color:var(--acc);color:var(--acc)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;border:1px solid var(--line2);background:var(--card2);color:var(--ink2);max-width:100%;vertical-align:middle}
.pill.ok{background:var(--okBg);border-color:transparent;color:var(--ok)}
.pill.warn{background:var(--warnBg);border-color:transparent;color:var(--warn)}
.pill.bad{background:var(--badBg);border-color:transparent;color:var(--bad)}
.pill.info{background:var(--infoBg);border-color:transparent;color:var(--info)}
.pill.acc{background:var(--accBg);border-color:transparent;color:var(--acc)}
.alert{border-radius:var(--r2);padding:11px 12px;margin:0 0 12px;font-size:.88rem;border:1px solid transparent}
.alert.ok{background:var(--okBg);border-color:rgba(52,211,153,.35)}
.alert.warn{background:var(--warnBg);border-color:rgba(251,191,36,.35)}
.alert.bad{background:var(--badBg);border-color:rgba(248,113,113,.4)}
.alert.info{background:var(--infoBg);border-color:rgba(96,165,250,.35)}
.alert b.at{display:block;margin-bottom:2px}
.list{display:flex;flex-direction:column;gap:8px}
.li{text-decoration:none;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px;cursor:pointer;min-height:56px;text-decoration:none;color:inherit}
.li .ic{width:40px;height:40px;border-radius:11px;background:var(--accBg);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:0 0 40px;font-weight:800}
.li .ic svg{width:22px;height:22px}
.li .t{font-weight:650}
.li .s{font-size:.8rem;color:var(--ink3)}
.li .chev{color:var(--ink3);flex:0 0 auto}
.menuGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mtile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.76rem;cursor:pointer;min-height:86px;color:var(--ink);text-decoration:none}
.mtile svg{width:26px;height:26px;color:var(--acc)}
.avatar{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04201D;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.25rem;flex:0 0 auto}
.avatar.sm{width:40px;height:40px;border-radius:12px;font-size:.95rem;flex-basis:40px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.tbl{width:100%;border-collapse:collapse;font-size:.84rem}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{color:var(--ink3);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.3px}
.tbl td.r,.tbl th.r{text-align:right}
.tblwrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;min-height:40px;border:0;background:none;border-radius:9px;font-size:.84rem;font-weight:600;color:var(--ink3);cursor:pointer;padding:4px}
.seg button.on{background:var(--acc);color:var(--accInk)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink2);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.ex{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;background:var(--card)}
.ex.done{border-color:rgba(52,211,153,.5);background:linear-gradient(150deg,var(--okBg),var(--card) 70%)}
.ex .nm{font-weight:700}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.setb{min-width:46px;height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);font-weight:700;cursor:pointer}
.setb.on{background:var(--ok);border-color:var(--ok);color:#052e1f}
.blockh{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-size:.8rem;font-weight:800;color:var(--acc);text-transform:uppercase;letter-spacing:.6px}
.blockh:after{content:"";flex:1;height:1px;background:var(--line)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:74px;padding:5px 3px;font-size:.66rem;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center}
.day b{font-size:.8rem}
.day.today{border-color:var(--acc)}
.day .ev{width:100%;border-radius:5px;padding:2px 1px;font-weight:700;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.s{background:var(--accBg);color:var(--acc)} .ev.t{background:var(--infoBg);color:var(--info)} .ev.c{background:var(--warnBg);color:var(--warn)} .ev.d{background:var(--okBg);color:var(--ok)}
.timer{font-variant-numeric:tabular-nums;font-size:2.2rem;font-weight:800;text-align:center;letter-spacing:1px}
.ready{display:grid;grid-template-columns:1fr;gap:8px}
.ready button{min-height:52px;border-radius:14px;border:1px solid var(--line2);background:var(--card2);font-weight:650;cursor:pointer;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:1rem}
.ready button.on{border-color:var(--acc);background:var(--accBg)}
.emoji{font-size:1.4rem}
.rpe{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rpe button{min-height:46px;border-radius:11px;border:1px solid var(--line2);background:var(--card2);font-weight:800;cursor:pointer}
.rpe button.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.vwrap{position:relative;width:100%;background:#000;border-radius:14px;overflow:hidden;touch-action:none}
.vwrap video{width:100%;display:block;max-height:60vh;object-fit:contain}
.vwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at 50% 35%,#16305A 0%,#0B1426 62%);transition:opacity .45s}
.splash.hide{opacity:0;pointer-events:none}
.logo{width:88px;height:88px}
.brand{font-size:1.7rem;font-weight:800;letter-spacing:.5px}
.brand em{font-style:normal;color:var(--acc)}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safeB));transform:translateX(-50%);z-index:90;background:#0E1B33;color:#fff;border:1px solid var(--line2);padding:11px 16px;border-radius:12px;font-size:.88rem;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
.sheetbg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:88vh;max-height:88dvh;overflow:auto;background:var(--bg2);border-radius:20px 20px 0 0;padding:18px var(--pad) calc(20px + var(--safeB));border-top:1px solid var(--line2)}
.sheet h2{margin-top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.88rem}
.kv dt{color:var(--ink3)} .kv dd{margin:0;text-align:right;font-weight:600;min-width:0;overflow-wrap:anywhere}
.ring{width:84px;height:84px;flex:0 0 84px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;width:84px;text-align:center;font-size:.7rem;color:var(--ink2)}
.badge .b{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;background:var(--accBg);border:2px solid var(--acc)}
.badge.off .b{filter:grayscale(1);opacity:.35;border-color:var(--line2)}
.hr{height:1px;background:var(--line);margin:14px 0}
.center{text-align:center}
.mt{margin-top:12px}.mb0{margin-bottom:0}
.nowrap{white-space:nowrap}
.scorebar{display:flex;align-items:center;gap:8px;font-size:.82rem;margin:6px 0}
.scorebar .lab{width:110px;flex:0 0 110px;color:var(--ink2)}
.scorebar .bar{flex:1}
.scorebar .v{width:44px;text-align:right;font-weight:700}
details.acc{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px}
details.acc>summary{padding:12px;cursor:pointer;font-weight:650;list-style:none;display:flex;align-items:center;gap:8px;min-height:48px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary:after{content:"›";margin-left:auto;transform:rotate(90deg);color:var(--ink3);font-size:1.3rem;transition:transform .2s}
details.acc[open]>summary:after{transform:rotate(-90deg)}
details.acc>div{padding:0 12px 12px}
.lock{max-width:420px;margin:0 auto;padding:calc(var(--safeT) + 40px) 20px 40px}
.empty{text-align:center;padding:26px 10px;color:var(--ink3)}
.empty svg{width:44px;height:44px;opacity:.6}
#printArea{display:none}
#repPrev .chart text{fill:#333}
#repPrev a{color:#0E9F94}
@media print{
  body{background:#fff!important;color:#111!important}
  #app,.toast,.sheetbg,.splash{display:none!important}
  #printArea{display:block!important;color:#111;font-size:11pt}
  #printArea .pcard{border:1px solid #ccd;border-radius:8px;padding:10px;margin:0 0 10px;break-inside:avoid}
  #printArea h1{font-size:18pt;margin:0 0 4px}
  #printArea h2{font-size:13pt;margin:14px 0 6px;color:#0B1426;border-bottom:2px solid #22D3C5;padding-bottom:3px}
  #printArea table{width:100%;border-collapse:collapse;font-size:9.5pt}
  #printArea th,#printArea td{border-bottom:1px solid #dde;padding:4px;text-align:left}
  #printArea svg text{fill:#333}
  @page{margin:14mm}
}
@media (min-width:521px){ body{background:#070D1A} #app{box-shadow:0 0 0 1px var(--line)} }
</style>
</head>

<div id="splash" class="splash" aria-hidden="true">
  <svg class="logo" viewBox="0 0 96 96" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3C5"/></linearGradient></defs><rect x="4" y="4" width="88" height="88" rx="24" fill="#0F1A30" stroke="url(#lg)" stroke-width="3"/><path d="M26 64 L42 30 L54 52 L62 40 L72 64" fill="none" stroke="url(#lg)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="62" cy="26" r="6" fill="#22D3C5"/></svg>
  <div class="brand">RUSH <em>ATHLETIC</em></div>
  <div class="muted small">Atletik performans · Yetenek keşfi · Gelişim</div>
</div>

<div id="printArea"></div>
<div id="toastHost"></div>
<div id="sheetHost"></div>
<script>
"use strict";

/* ===== data.js ===== */
/* =========================================================================
   RUSH ATHLETIC — MODÜLER KATALOGLAR (testler, egzersizler, branşlar, sağlık)
   Yeni branş / test / egzersiz eklemek için yalnızca bu dizilere kayıt eklenir.
   ========================================================================= */
const APP_VERSION = "1.0.0";
const ENGINE_VERSION = "kural-tabanlı motor v1.0";

const QUALITIES = [
  {k:"str", n:"Kuvvet"}, {k:"pow", n:"Patlayıcı kuvvet"}, {k:"spd", n:"Sürat"},
  {k:"agi", n:"Çeviklik"}, {k:"end", n:"Dayanıklılık"}, {k:"coo", n:"Koordinasyon"},
  {k:"bal", n:"Denge"}, {k:"mob", n:"Mobilite"}, {k:"rea", n:"Reaksiyon"}
];
const QN = Object.fromEntries(QUALITIES.map(q => [q.k, q.n]));
const FEAT_N = Object.assign({H:"Boy (yaşa göre)", AS:"Kol açıklığı / boy", M:"Vücut kütlesi (boya göre)"}, QN);

/* Hareket kısıtlama etiketleri — sağlık kayıtlarından gelir, egzersiz/test filtresinde kullanılır */
const RTAGS = {
  jump:"Sıçrama / iniş (plyometrik)", sprint:"Maksimal sürat koşusu", run:"Koşu / tekrarlı koşu",
  cod:"Ani yön değiştirme", overhead:"Baş üstü kol hareketleri", upperLoad:"Üst ekstremite itme yükü",
  wrist:"El bileği yüklenmesi", grip:"Kavrama / taşıma", spine:"Omurgaya eksenel yük",
  flexion:"Omurga fleksiyonu (öne eğilme)", rotation:"Dirençli / hızlı gövde rotasyonu",
  deepKnee:"Derin diz bükme", contact:"Fiziksel temas", inversion:"Baş aşağı pozisyon",
  valsalva:"Nefes tutma / yüksek izometrik zorlanma", maxEffort:"Maksimal efor / yüksek nabız"
};

   ========================================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = (p = "") => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const isNum = v => typeof v === "number" && isFinite(v);
const num = v => { if (v === "" || v == null) return null; const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; };

/* ---------- Base64 / kripto ---------- */
const b64e = buf => { const b = new Uint8Array(buf); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
const b64d = str => { const s = atob(str); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; };
const TE = new TextEncoder(), TD = new TextDecoder();
const PBKDF2_IT = 150000;
function cryptoOK() { return !!(window.crypto && crypto.subtle && window.isSecureContext !== false); }
async function deriveKEK(password, saltB64, it) {
  const base = await crypto.subtle.importKey("raw", TE.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", salt: b64d(saltB64), iterations: it, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, ["encrypt", "decrypt"]);
}
async function aesEnc(key, bytes) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({name: "AES-GCM", iv}, key, bytes); return {iv: b64e(iv), ct: b64e(ct)}; }
async function aesDec(key, obj) { return new Uint8Array(await crypto.subtle.decrypt({name: "AES-GCM", iv: b64d(obj.iv)}, key, b64d(obj.ct))); }
async function importDEK(raw) { return crypto.subtle.importKey("raw", raw, {name: "AES-GCM"}, false, ["encrypt", "decrypt"]); }
async function wrapFor(email, password, memberId, dekRaw) {
  const salt = b64e(crypto.getRandomValues(new Uint8Array(16)));
  const kek = await deriveKEK(password, salt, PBKDF2_IT);
  return {email: email.toLowerCase().trim(), memberId, salt, it: PBKDF2_IT, wk: await aesEnc(kek, dekRaw)};
}

const IDX_KEY = "rush.index.v1", REM_KEY = "rush.remember.v1", PREF_KEY = "rush.prefs.v1";
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { console.warn(e); return false; } };

const vaultIds = () => lsGet(IDX_KEY) || [];
const vaultGet = id => lsGet("rush.v." + id);
function vaultPut(id, v) {
  const ok = lsSet("rush.v." + id, v);
  if (!ok) throw new Error("Depolama alanı dolu. Eski videoları veya kayıtları silin.");
  const ids = vaultIds(); if (!ids.includes(id)) { ids.push(id); lsSet(IDX_KEY, ids); }
}

async function createWorkspace({wsName, name, email, password, role}) {
  const dekRaw = crypto.getRandomValues(new Uint8Array(32));
  const db = emptyDB(wsName || (name + " çalışma alanı"));
  const me = {id: uid("m_"), name, email: email.toLowerCase().trim(), role, admin: true, athleteIds: [], createdAt: Date.now()};
  db.members.push(me);
  const vault = {v: 1, wsId: db.ws.id, wsName: db.ws.name, users: [await wrapFor(email, password, me.id, dekRaw)], data: null, updatedAt: Date.now()};
  const dek = await importDEK(dekRaw);
  vault.data = await aesEnc(dek, TE.encode(JSON.stringify(db)));
  vaultPut(db.ws.id, vault);
  return openSession(db.ws.id, dekRaw, me.id, db);
}

async function openSession(wsId, dekRaw, memberId, db) {
  S.ws = wsId; S.dekRaw = dekRaw; S.dek = await importDEK(dekRaw);
  if (!db) { const v = vaultGet(wsId); db = JSON.parse(TD.decode(await aesDec(S.dek, v.data))); }
  DB = S.db = migrate(db);
  S.me = DB.members.find(m => m.id === memberId);
  if (!S.me) throw new Error("Üye bulunamadı");
  S.lastSave = Date.now();
  return S.me;
}

async function login(email, password, remember) {
  email = String(email || "").toLowerCase().trim();
  for (const id of vaultIds()) {
    const v = vaultGet(id); if (!v) continue;
    const u = v.users.find(x => x.email === email); if (!u) continue;
    try {
      const kek = await deriveKEK(password, u.salt, u.it);
      const raw = await aesDec(kek, u.wk);
      await openSession(id, raw, u.memberId);
      if (remember) lsSet(REM_KEY, {wsId: id, memberId: u.memberId, k: b64e(raw)}); else lsDel(REM_KEY);
      audit("Giriş yapıldı", null, S.me.email);
      return true;
    } catch (e) { throw new Error("E-posta veya şifre hatalı."); }
  }
  throw new Error("E-posta veya şifre hatalı.");
}
async function tryRemembered() {
  const r = lsGet(REM_KEY); if (!r) return false;
  try { await openSession(r.wsId, b64d(r.k), r.memberId); return true; } catch (e) { lsDel(REM_KEY); return false; }
}

  try {
    const v = vaultGet(S.ws);

}

/* ---------- IndexedDB (şifreli video blob) ---------- */
function idb() {
  return new Promise((res, rej) => { const r = indexedDB.open("rush-media", 1); r.onupgradeneeded = () => r.result.createObjectStore("blobs"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function idbPut(key, val) { const d = await idb(); return new Promise((res, rej) => { const t = d.transaction("blobs", "readwrite"); t.objectStore("blobs").put(val, key); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
async function idbGet(key) { const d = await idb(); return new Promise((res, rej) => { const t = d.transaction("blobs", "readonly"); const q = t.objectStore("blobs").get(key); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbDel(key) { const d = await idb(); return new Promise(res => { const t = d.transaction("blobs", "readwrite"); t.objectStore("blobs").delete(key); t.oncomplete = () => res(); t.onerror = () => res(); }); }
async function idbClear() { try { const d = await idb(); await new Promise(res => { const t = d.transaction("blobs", "readwrite"); t.objectStore("blobs").clear(); t.oncomplete = res; t.onerror = res; }); } catch (e) {} }
async function storeBlob(file) {
  const key = uid("blob_");
  const enc = await aesEnc(S.dek, new Uint8Array(await file.arrayBuffer()));
  await idbPut(key, {ws: S.ws, type: file.type || "video/mp4", iv: enc.iv, ct: enc.ct});
  return key;
}
async function loadBlobURL(key) {
  const r = await idbGet(key); if (!r) return null;
  const bytes = await aesDec(S.dek, r);
  return URL.createObjectURL(new Blob([bytes], {type: r.type}));
}

let lastSched = 0;
function runScheduler(force) {
  if (!DB || !S.me) return; if (!force && Date.now() - lastSched < 60000) return; lastSched = Date.now();
  const t = todayISO();
  for (const a of DB.athletes) {
    for (const p of programsOf(a.id).filter(p => p.status === "onaylı")) {
      const cw = currentWeek(p); const wk = p.weeksData.find(w => w.w === cw); if (!wk) continue;
      for (const s of wk.sessions) if (s.date === t && !logOf(p.id, cw, s.d)) notify({key: `today:${p.id}:${t}:${s.d}`, athleteId: a.id, type: "training", title: "Bugün antrenman var 💪", body: `${a.name}: ${s.title} (≈${s.estMin} dk)`, roles: ["athlete", "parent"]});
      if (p.testWeeks.includes(cw) && !testsOf(a.id).some(r => r.date >= wk.start)) notify({key: `testdue:${p.id}:${cw}`, athleteId: a.id, type: "test", title: "Test zamanı", body: `${a.name}: Hafta ${cw} değerlendirme haftası. Önerilen batarya: ${p.battery.map(id => TEST[id] ? TEST[id].n : id).slice(0, 4).join(", ")}…`, roles: ["coach", "parent", "athlete"]});
    }
    for (const p of programsOf(a.id).filter(p => p.status === "onay bekliyor")) notify({key: `pending:${p.id}`, athleteId: a.id, type: "program", title: "Program onay bekliyor", body: `${a.name} için ${p.weeks} haftalık program incelemenizi bekliyor.`, roles: ["coach"]});
    const ws = mondayOf(t);
    if (DB.logs.some(l => l.athleteId === a.id)) {
      const prevS = addDays(ws, -7), prevE = addDays(ws, -1), ad = adherence(a.id, prevS, prevE);
      const ld = Object.values(dailyLoads(a.id, prevS, prevE)).reduce((s, v) => s + v.load, 0);
      notify({key: `weekly:${a.id}:${ws}`, athleteId: a.id, type: "summary", title: "Haftalık gelişim özeti", body: `${a.name}: geçen hafta ${ad.done}/${ad.planned} seans tamamlandı, toplam yük ${Math.round(ld)} AU.`, roles: ["coach", "parent", "athlete"]});
      const ls = loadSummary(a);
      ls.flags.filter(f => f.lv !== "info").forEach((f, i) => notify({key: `load:${a.id}:${ws}:${f.t.slice(0, 24)}`, athleteId: a.id, type: "load", title: "Yük / toparlanma uyarısı", body: `${a.name}: ${f.t}`, roles: ["coach", "parent"]}));
    }
  }
}

    {e: "🎯", n: "İlk antrenman", on: logs.length >= 1}, {e: "🔥", n: "3 hafta düzen", on: weekStreak(a.id) >= 3}, {e: "💯", n: "10 antrenman", on: logs.length >= 10},

  ];
}

FORM.meas = (d, f) => {
  const m = {id: uid("ms_"), athleteId: f.dataset.aid, date: d.date, posture: d.posture || [], note: d.note, bodyCompMethod: d.bodyCompMethod};
  let n = 0;
  AFIELDS.forEach(([k]) => { const v = num(d[k]); if (v != null) { m[k] = v; n++; } });
  LRFIELDS.forEach(([k]) => ["L", "R"].forEach(s => { const v = num(d[k + s]); if (v != null) { m[k + s] = v; n++; } }));
  if (!n && !m.posture.length) throw new Error("En az bir ölçüm girin.");
  if (isNum(m.heightCm) && (m.heightCm < 80 || m.heightCm > 230)) throw new Error("Boy 80–230 cm aralığında olmalı.");
  if (isNum(m.sittingHeightCm) && isNum(m.heightCm) && m.sittingHeightCm >= m.heightCm) throw new Error("Oturma boyu boydan küçük olmalı.");
  if (isNum(m.weightKg) && (m.weightKg < 12 || m.weightKg > 180)) throw new Error("Kilo 12–180 kg aralığında olmalı.");
  DB.measurements.push(m); audit("Antropometrik ölçüm eklendi", m.athleteId, fmtD(m.date)); save(); closeSheet(); toast("Ölçüm kaydedildi"); reRender();
};

    ${alertBox("info", "", "Tahmini biyolojik olgunlaşma <b>kesin tıbbi veri değildir</b>. Yetişkin boyu veya gelecekteki performans tahmini yapılmaz.")}

      <dl class="kv mt"><dt>Durum</dt><dd>${esc(mat.status)}</dd><dt>Zamanlama</dt><dd>${esc(mat.timing)}</dd><dt>Yöntem</dt><dd>${esc(mat.method)}</dd>${isNum(mat.mir) ? `<dt>Mirwald (2002) karşılaştırma</dt><dd>${fmtN(mat.mir, 2)} yıl</dd>` : ""}<dt>Ölçüm tarihi / yaş</dt><dd>${fmtD(mat.date)} · ${fmtN(mat.age, 2)}</dd></dl>
      <ul class="tiny muted" style="padding-left:18px">${mat.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>`}</div>
    <div class="card"><h3>Büyüme hızı</h3>${gv ? gv.insufficient ? `<p class="small muted">${esc(gv.note)}</p>` : `<div class="stat"><b>${fmtN(gv.v, 1)} cm/yıl</b><span>${fmtD(gv.from)} – ${fmtD(gv.to)}</span></div><p class="small">${esc(gv.note)}</p>` : `<p class="small muted">En az iki boy ölçümü gerekli.</p>`}

/* =========================================================================
   TEST MERKEZİ, SONUÇLAR, RADAR, REAKSİYON TESTİ, BRANŞ KEŞFİ, POZİSYONLAR
   ========================================================================= */
function refText(t, a, date) {
  const nm = normFor(t, ageAt(a.birthDate, date), sexKey(a));
  return nm ? `${fmtN(nm.mean, t.dec)} ± ${fmtN(nm.sd, t.dec)} ${t.u}` : "Norm yok (bireysel karşılaştırma)";
}
function testInfo(t, a) {
  return `<dl class="kv"><dt>Amaç</dt><dd>${esc(t.purpose)}</dd><dt>Birim</dt><dd>${esc(t.u)}${t.lb ? " (düşük daha iyi)" : ""}</dd><dt>Ekipman</dt><dd>${esc(t.eq)}</dd><dt>En düşük yaş</dt><dd>${t.minAge}</dd><dt>Referans (bu yaş/cinsiyet)</dt><dd>${refText(t, a)}</dd><dt>Tipik ölçüm hatası</dt><dd>${isNum(t.te) ? fmtN(t.te, t.dec) + " " + t.u : "≈%" + t.cv}</dd><dt>Referans popülasyon</dt><dd>${esc(t.pop)}</dd></dl>
    <p class="small"><b>Protokol:</b> ${esc(t.proto)}</p><p class="tiny muted"><b>Kaynak:</b> ${esc(t.src)}</p>${t.maxEff ? alertBox("warn", "Maksimal efor testi", "Çocuklarda otomatik önerilmez; antrenör onayı ve sağlık engeli olmaması gerekir.") : ""}`;
}
route("/a/:aid/tests", p => {
  const a = getA(p.aid), sug = suggestTests(a), canE = canEnterTests(a.id) || role() === "athlete";
  const row = t => { const rs = testsOf(a.id, t.id), l = rs[rs.length - 1]; const sc = l ? scoreResult(a, l) : null;
    return `<details class="acc"><summary><div class="grow"><div>${esc(t.n)}</div><div class="tiny muted">${l ? `Son: ${t.bil && isNum(l.left) ? `S ${fmtN(l.left, t.dec)} / Sğ ${fmtN(l.right, t.dec)}` : fmtN(testValue(l), t.dec)} ${t.u} · ${fmtD(l.date)}${isNum(sc) ? " · puan " + sc : ""}` : "Henüz ölçülmedi"}</div></div></summary><div>${testInfo(t, a)}
      ${(canEnterTests(a.id) || (role() === "athlete" && t.inApp)) ? `<div class="btns">${t.inApp ? `<a class="btn sm blue" href="#/a/${a.id}/reaction">Uygulamada ölç</a>` : ""}${canEnterTests(a.id) ? `<button class="btn sm pri" data-act="testEntry" data-aid="${a.id}" data-t="${t.id}">Sonuç gir</button>` : ""}</div>` : ""}</div></details>`; };
  return {title: "Performans test merkezi", html: `
    ${!canEnterTests(a.id) ? alertBox("info", "", "Test sonuçlarını antrenör girer. Reaksiyon testini uygulama içinden kendiniz yapabilirsiniz.") : ""}
    <div class="card acc"><h3>Önerilen test bataryası</h3><p class="small muted">Yaş (${Math.floor(ageAt(a.birthDate))}), branş (${esc((sportById(a.primarySport) || {n: "genel"}).n)}) ve sağlık kısıtlamalarına göre seçildi.</p><div class="chips">${sug.recommended.map(t => pill(t.n, "acc")).join("")}</div>
      ${canEnterTests(a.id) ? `<button class="btn pri block mt" data-act="batteryEntry" data-aid="${a.id}">Bataryayı toplu gir</button>` : ""}</div>
    ${sug.coachOnly.length ? `<div class="card"><h3>Yalnızca antrenör onayıyla</h3>${sug.coachOnly.map(x => `<div class="small" style="padding:4px 0">${esc(x.t.n)} ${x.blocked ? pill("sağlık nedeniyle uygun değil", "bad") : pill("maksimal efor", "warn")}</div>`).join("")}</div>` : ""}
    ${sug.excluded.length ? `<details class="acc"><summary>Uygun olmayan testler (${sug.excluded.length})</summary><div>${sug.excluded.map(x => `<div class="small" style="padding:4px 0"><b>${esc(x.t.n)}</b> — <span class="muted">${esc(x.why)}</span></div>`).join("")}</div></details>` : ""}
    ${QUALITIES.map(q => `<div class="blockh">${q.n}</div>${TESTS.filter(t => t.q === q.k).map(row).join("")}`).join("")}
    <a class="btn block mt" href="#/a/${a.id}/results">Sonuçlar ve karşılaştırma</a>`};
});
function testFields(t, prefix = "") {
  return t.bil ? `<div class="grid2">${field("Sol (" + t.u + ")", inp(prefix + "left", "", 'inputmode="decimal"'))}${field("Sağ (" + t.u + ")", inp(prefix + "right", "", 'inputmode="decimal"'))}</div>` : field("Sonuç (" + t.u + ")", inp(prefix + "value", "", 'inputmode="decimal"'));
}
ACT.testEntry = el => {
  const a = getA(el.dataset.aid), t = TEST[el.dataset.t], h = holds(a.id);
  if (t.maxEff && h.length) { sheet(`<h2>${esc(t.n)}</h2>${alertBox("bad", "Uygulanamaz", "Maksimal efor testleri tıbbi onay bekleyen durumlarda uygulanamaz.<br>" + h.map(esc).join("<br>"))}<button class="btn block" data-act="closeSheet">Kapat</button>`); return; }
  sheet(`<h2>${esc(t.n)}</h2><p class="small muted">${esc(t.proto)}</p><form data-form="testRes" data-aid="${a.id}" data-t="${t.id}">
    ${field("Tarih", inp("date", todayISO(), 'type="date" required max="' + todayISO() + '"'))}${testFields(t)}
    ${field("Test koşulları", inp("cond", "", 'placeholder="ör. kapalı salon, fotosel, ısınma sonrası"'), "Koşulların kaydı tekrar testlerde karşılaştırmayı güvenilir kılar.")}
    ${t.maxEff ? `<label class="check"><input type="checkbox" name="approve" required><span class="small"><b>Antrenör onayı:</b> Sporcu sağlıklı, hazır ve maksimal efor testine uygundur; test gözetim altında yapıldı.</span></label>` : ""}
    <div class="btns"><button type="button" class="btn" data-act="closeSheet">Vazgeç</button><button class="btn pri" type="submit">Kaydet</button></div></form>`);
};
function saveTestResult(a, t, d, date, cond) {
  const r = {id: uid("t_"), athleteId: a.id, testId: t.id, date, cond: cond || "", by: S.me.name, at: Date.now()};
  if (t.bil) { r.left = num(d.left); r.right = num(d.right); if (!isNum(r.left) && !isNum(r.right)) return null; }
  else { r.value = num(d.value); if (!isNum(r.value)) return null; }
  const v = testValue(r);
  if (v < 0 && !["sitreach", "shoulder"].includes(t.id)) throw new Error(t.n + ": negatif değer girilemez.");
  if (t.max && v > t.max) throw new Error(`${t.n}: en fazla ${t.max} ${t.u}.`);
  const nm = normFor(t, ageAt(a.birthDate, date), sexKey(a));
  if (nm && Math.abs(v - nm.mean) > 5 * nm.sd) throw new Error(`${t.n}: ${v} ${t.u} beklenen aralığın çok dışında. Birimi kontrol edin.`);
  const prev = testsOf(a.id, t.id);
  DB.tests.push(r);
  if (prev.length) {
    const best = prev.map(testValue).reduce((b, x) => t.lb ? Math.min(b, x) : Math.max(b, x));
    const c = compareResults(t, {date: prev[prev.length - 1].date, value: best}, r);
    if ((t.lb ? v < best : v > best) && c && c.ratio >= 1) notify({key: "pr:" + r.id, athleteId: a.id, type: "milestone", title: "Kişisel rekor! 🏅", body: `${a.name}: ${t.n} ${fmtN(v, t.dec)} ${t.u} (önceki en iyi ${fmtN(best, t.dec)})`});
  }
  (a.goals || []).filter(g => !g.done && g.testId === t.id && isNum(g.target)).forEach(g => { if (t.lb ? v <= g.target : v >= g.target) { g.done = true; notify({key: "goalhit:" + g.id, athleteId: a.id, type: "milestone", title: "Hedefe ulaşıldı 🎉", body: `${a.name}: ${g.text}`}); } });
  audit("Test sonucu girildi", a.id, `${t.n}: ${fmtN(v, t.dec)} ${t.u}`);
  return r;
}
FORM.testRes = (d, f) => {
  const a = getA(f.dataset.aid), t = TEST[f.dataset.t];
  const r = saveTestResult(a, t, d, d.date, d.cond); if (!r) throw new Error("Sonuç girin.");
  save(); closeSheet(); toast("Sonuç kaydedildi"); reRender();
};
ACT.batteryEntry = el => {
  const a = getA(el.dataset.aid), sug = suggestTests(a).recommended;
  sheet(`<h2>Test bataryası</h2><form data-form="battery" data-aid="${a.id}">${field("Değerlendirme tarihi", inp("date", todayISO(), 'type="date" required'))}${field("Test koşulları", inp("cond", "", 'placeholder="ör. kapalı salon, fotosel"'))}
    <p class="tiny muted">Boş bırakılan testler kaydedilmez.</p>${sug.map(t => `<div class="card flat" style="padding:10px"><b class="small">${esc(t.n)}</b>${testFields(t, t.id + "__")}</div>`).join("")}
    <div class="btns"><button type="button" class="btn" data-act="closeSheet">Vazgeç</button><button class="btn pri" type="submit">Tümünü kaydet</button></div></form>`);
};
FORM.battery = (d, f) => {
  const a = getA(f.dataset.aid); let n = 0;
  for (const t of suggestTests(a).recommended) { const sub = {}; ["value", "left", "right"].forEach(k => sub[k] = d[t.id + "__" + k]); if (saveTestResult(a, t, sub, d.date, d.cond)) n++; }
  if (!n) throw new Error("En az bir sonuç girin.");
  save(); closeSheet(); toast(n + " sonuç kaydedildi"); reRender();
};

    ${dates.length ? `<div class="card"><h3>Değerlendirme oturumları</h3><div class="chips">${dates.map(d => pill(fmtD(d) + " · " + testsOf(a.id).filter(r => r.date === d).length + " test")).join("")}</div></div>` : ""}
    ${done.map(t => {
      const rs = testsOf(a.id, t.id), l = rs[rs.length - 1], f = rs[0], sc = scoreResult(a, l), as = asym(t, l), c = rs.length > 1 ? compareResults(t, f, l) : null;

        ${as ? `<p class="small mt">Sol ${fmtN(l.left, t.dec)} / Sağ ${fmtN(l.right, t.dec)} ${t.u} — asimetri ${esc(as.txt)} ${as.flag ? pill("dikkat", "warn") : pill("kabul edilebilir", "ok")}</p>` : ""}
        ${c ? `<p class="small">İlk → son: ${fmtN(c.v1, t.dec)} → ${fmtN(c.v2, t.dec)} ${t.u} (${c.pct != null ? (c.pct > 0 ? "+" : "") + fmtN(c.pct, 1) + "%" : ""}, ${c.days} gün) ${pill(c.verdict, c.cls)}</p>${c.growthNote ? `<p class="tiny muted">${c.growthNote}</p>` : ""}` : ""}

    }).join("")}
    <p class="tiny muted">Değişim yorumu tipik ölçüm hatasına (Hopkins 2000) göre yapılır: değişim < 1× hata → anlamlı değil; 1–2× → olası; ≥2× → büyük olasılıkla gerçek. Farklı yöntem/koşullardaki ölçümler doğrudan karşılaştırılmamalıdır.</p>`};
});

/* ---------- Radar ---------- */
let radarShow = {cur: true, prev: true, tgt: true};
route("/a/:aid/radar", p => {
  const a = getA(p.aid), cur = qualityScores(a), prev = qualityScores(a, "previous"), tgt = targetScores(a, cur);
  const val = o => Object.fromEntries(QUALITIES.map(q => [q.k, o[q.k] && typeof o[q.k] === "object" ? o[q.k].score : o[q.k]]));
  const series = [];
  if (radarShow.cur) series.push({name: "Mevcut", color: COL.cur, values: val(cur), fill: .18});
  if (radarShow.prev) series.push({name: "Önceki", color: COL.prev, values: val(prev), dash: "5 4", dot: 2.5});
  if (radarShow.tgt) series.push({name: "Hedef", color: COL.tgt, values: tgt, dash: "2 4", dot: 2});
  if (!radarShow.cur) series.unshift({name: "", color: "transparent", values: val(cur)});
  const missing = QUALITIES.filter(q => !cur[q.k].hasData);
  return {title: "Atletik radar", html: `<div class="seg">${[["cur", "Mevcut"], ["prev", "Önceki"], ["tgt", "Hedef"]].map(([k, n]) => `<button class="${radarShow[k] ? "on" : ""}" data-act="radarT" data-k="${k}">${n}</button>`).join("")}</div>
    <div class="card">${radarSVG(QUALITIES, series)}${legend([[COL.cur, "Mevcut seviye"], [COL.prev, "Önceki değerlendirme"], [COL.tgt, "Hedeflenen seviye"]])}</div>

function rtDraw() {

FORM.itemSave = (dd, f) => {
  const pr = DB.programs.find(x => x.id === f.dataset.pid), w = +f.dataset.w, d = +f.dataset.d, b = +f.dataset.b, i = +f.dataset.i;
  const it0 = pr.weeksData.find(x => x.w === w).sessions.find(x => x.d === d).blocks[b].items[i];
  if (!dd.reason.trim()) throw new Error("Gerekçe zorunlu.");
  const sN = num(dd.s); if (!isNum(sN) || sN < 1 || sN > 10) throw new Error("Set 1–10 arasında olmalı.");
  const exName = exById(it0.e).n, targets = itemScopeTargets(pr, w, d, b, it0.e, dd.scope);
  const ch = [];
  if (dd.swap && dd.swap !== it0.e) learnPref(it0.e, dd.swap);
  for (const T of targets) {
    const it = T.it;
    if (dd.swap) it.e = dd.swap;
    it.s = sN; ["r", "t", "rest"].forEach(k => { const v = num(dd[k]); if (v == null) delete it[k]; else it[k] = v; });
    const dv = num(dd.dd); if (dv == null) delete it.d; else it.d = dv;
    it.rpe = dd.rpe; it.note = dd.note; it.mod = 1;
  }
  ch.push(`${exName}${dd.swap ? " → " + exById(dd.swap).n : ""}: ${sN} set${dd.r ? " × " + dd.r : ""} (${targets.length} seans, ${{week: "bu hafta", block: "blok", all: "kalan haftalar"}[dd.scope]})`);
  pr.changes.push({at: Date.now(), by: S.me.name, role: role(), what: ch.join("; "), reason: dd.reason.trim()});
  audit("Program düzenlendi", pr.athleteId, ch[0]); save(); closeSheet(); toast("Değişiklik kaydedildi"); reRender();
};

  const a = getA(p.aid), q = new URLSearchParams(CUR.query || ""), off = parseInt(q.get("o")) || 0;
  const ws = addDays(mondayOf(todayISO()), off * 7), we = addDays(ws, 6), t = todayISO();
  const pl = plannedSessions(a.id, ws, we), comps = compsBetween(a, ws, we), team = (a.teamDays || []).map(Number);
  const ext = DB.extLoads.filter(e => e.athleteId === a.id && e.date >= ws && e.date <= we);
  const days = Array.from({length: 7}, (_, i) => addDays(ws, i));
  const ad = adherence(a.id, addDays(t, -27), t);
  const pend = programsOf(a.id).find(x => x.status === "onay bekliyor");
  return {title: "Haftalık takvim", html: `<div class="row between"><a class="btn sm" href="#/a/${a.id}/calendar?o=${off - 1}">‹ Önceki</a><b class="small">${fmtD(ws)} – ${fmtD(we)}</b><a class="btn sm" href="#/a/${a.id}/calendar?o=${off + 1}">Sonraki ›</a></div>
    ${pend ? alertBox("warn", "", "Onay bekleyen bir program var; onaylanana kadar takvimde gösterilmez.") : ""}
    <div class="week mt">${days.map(d => { const dow = parseISO(d).getDay(); const ss = pl.filter(x => x.s.date === d); const cs = comps.filter(c => c.date === d);
      return `<div class="day ${d === t ? "today" : ""}"><span class="muted">${DOW[dow]}</span><b>${parseISO(d).getDate()}</b>${ss.map(x => { const l = logOf(x.p.id, x.wk.w, x.s.d); return `<span class="ev ${l && l.status === "tamamlandı" ? "d" : "s"}">${l && l.status === "tamamlandı" ? "✓" : "S"}${x.s.test ? "T" : ""}</span>`; }).join("")}${team.includes(dow) ? '<span class="ev t">Takım</span>' : ""}${cs.map(() => '<span class="ev c">Maç</span>').join("")}</div>`; }).join("")}</div>
    ${legend([[COL.cur, "Program seansı (S)"], [COL.ok, "Tamamlandı"], [COL.blue, "Takım antrenmanı"], [COL.tgt, "Müsabaka"]])}
    <h3>Bu haftanın seansları</h3>${pl.length ? `<div class="list">${pl.map(x => { const l = logOf(x.p.id, x.wk.w, x.s.d); return li(`#/a/${a.id}/session/${x.p.id}/${x.wk.w}/${x.s.d}`, "bolt", `${DOWL[x.s.dow]} — ${esc(x.s.title)}`, `Hafta ${x.wk.w} · ${esc(x.wk.phase)} · ≈${x.s.estMin} dk`, l ? pill(l.status, l.status === "tamamlandı" ? "ok" : "warn") : x.s.date < t ? pill("yapılmadı", "bad") : ""); }).join("")}</div>` : `<p class="small muted">Bu hafta planlı seans yok.</p>`}
    ${comps.length ? `<h3>Müsabakalar</h3>${comps.map(c => `<div class="card flat small"><b>${esc(c.name)}</b> · ${fmtD(c.date)} · önem: ${esc(c.imp)}</div>`).join("")}` : ""}
    ${ext.length ? `<h3>Kaydedilen dış yükler</h3>${ext.map(e => `<div class="small">${fmtD(e.date)} · ${esc(e.type)} · ${e.duration} dk · RPE ${e.rpe}</div>`).join("")}` : ""}
    <div class="card mt"><h3>Antrenman devamlılığı (son 4 hafta)</h3><div class="row">${ringSVG(ad.pct, "devam")}<div class="small">${ad.done} / ${ad.planned} planlı seans tamamlandı.</div></div></div>`};
});

/* ---------- Günlük antrenman ---------- */
const READY = [["Çok iyi", "😄"], ["İyi", "🙂"], ["Normal", "😐"], ["Yorgun", "😮‍💨"], ["Çok yorgun", "😫"]];
const RPE_D = ["Dinlenme", "Çok çok hafif", "Çok hafif", "Hafif", "Orta", "Biraz zor", "Zor", "Zor+", "Çok zor", "Çok çok zor", "Maksimal"];
let SESS = {timer: null, rest: null, restEnd: 0};
function sessionCtx(p) { const pr = DB.programs.find(x => x.id === p.pid); if (!pr) return null; const wk = pr.weeksData.find(w => w.w === +p.w); if (!wk) return null; const s = wk.sessions.find(x => x.d === +p.d); return s ? {pr, wk, s} : null; }
function adaptedItems(s, log) {
  const out = [];
  s.blocks.forEach((b, bi) => b.items.forEach((it, ii) => {
    const ex = exById(it.e); let skip = null, sets = it.s;
    if (log.mod === "hafif" && !["warm", "mob", "cool"].includes(b.k)) skip = "Bugün yalnızca hafif mobilite";
    if (log.mod === "ağrı" && ex && (ex.tg.includes("jump") || ex.tg.includes("sprint"))) skip = "Ağrı bildirimi: sıçrama/sprint çıkarıldı";
    if (log.mod === "yorgun" && ex && ((ex.c === "plyo" && ex.lv >= 3) || ex.tg.includes("maxEffort"))) skip = "Yorgunluk: yüksek şiddet çıkarıldı";
    if ((log.mod === "yorgun" || log.mod === "ağrı") && !["warm", "mob", "cool"].includes(b.k)) sets = Math.max(1, Math.round(sets * 0.7));
    out.push({bi, ii, b, it, ex, sets, skip, key: bi + "-" + ii});
  }));
  return out;
}
route("/a/:aid/session/:pid/:w/:d", p => {

      <div class="card"><div class="grid2">${field("Dün geceki uyku (saat)", inp("sleep", a.sleepHours || "", 'inputmode="decimal"'))}${field("Ağrın var mı?", sel("pain", [["0", "Yok"], ["1", "Var"]], "0", 'id="painSel"'))}</div>
      <div id="painBox" style="display:none">${field("Ağrı bölgesi", inp("painArea", "", 'placeholder="ör. sağ diz"'))}${field("Ağrı şiddeti (0–10)", sel("painLevel", Array.from({length: 11}, (_, i) => [String(i), String(i)]), "2"))}</div></div>
      <button class="btn pri block" type="submit">Devam et</button></form>` : alertBox("info", "", "Seans henüz başlatılmadı."))};
  }
  afterRender.push(() => wireSessionTimers(log));
  if (log.status === "durduruldu") return {title: "Günlük antrenman", html: head + alertBox("bad", "Antrenman durduruldu", esc(log.stopReason || "") + "<br><br>Bugün dinlenmen önerilir. Ağrı devam ederse velin ve antrenörünle birlikte bir sağlık uzmanına başvur. Uygulama teşhis koymaz.") + (log.painResolved ? "" : canEditProgram(a.id) ? `<button class="btn block" data-act="painResolve" data-id="${log.id}">Antrenör: değerlendirildi, devam edilebilir</button>` : "") + logSummary(log)};
  const items = adaptedItems(s, log), done = log.done || {};
  const totalSets = items.filter(x => !x.skip).reduce((n, x) => n + x.sets, 0), doneSets = items.filter(x => !x.skip).reduce((n, x) => n + Math.min(x.sets, done[x.key] || 0), 0);
  const finished = log.status === "tamamlandı" || log.status === "kısmi";
  let lastB = -1;
  return {title: "Günlük antrenman", keepScroll: true, html: head +
    (log.mod !== "normal" ? alertBox(log.mod === "hafif" ? "bad" : "warn", "Antrenman uyarlandı", {yorgun: "Yorgunluk bildirdiğin için hacim %30 azaltıldı ve yüksek şiddetli çalışmalar çıkarıldı.", ağrı: `Hafif ağrı (${log.painLevel}/10, ${esc(log.painArea || "")}) bildirdin: sıçrama ve sprint çıkarıldı, hacim azaltıldı. Ağrı artarsa hemen dur.`, hafif: "Bugün yalnızca hafif mobilite ve soğuma uygulanır."}[log.mod] || "") : "") +
    `<div class="card" style="position:sticky;top:calc(var(--safeT) + 66px);z-index:10"><div class="row between"><div><div class="tiny muted">Süre</div><div class="timer" id="sessT" style="font-size:1.5rem;text-align:left">00:00</div></div><div class="grow" style="max-width:150px"><div class="tiny muted">${doneSets}/${totalSets} set</div><div class="bar"><i style="width:${totalSets ? doneSets / totalSets * 100 : 0}%"></i></div></div><div id="restBox" class="center" style="min-width:86px"></div></div></div>
    ${s.test ? `<div class="card flat"><h3>Test bataryası (değerlendirme günü)</h3><p class="small muted">Isınmadan sonra uygulayın. ${canEnterTests(a.id) ? "" : "Testleri antrenör kaydeder."}</p><div class="chips">${pr.battery.map(id => TEST[id] ? (canEnterTests(a.id) ? `<button class="chip" data-act="testEntry" data-aid="${a.id}" data-t="${id}">${esc(TEST[id].n)}</button>` : pill(TEST[id].n)) : "").join("")}</div></div>` : ""}
    ${items.map(x => { const hb = x.bi !== lastB ? `<div class="blockh">${esc(x.b.n)}</div>` : ""; lastB = x.bi; const dn = done[x.key] || 0;
      return hb + `<div class="ex ${!x.skip && dn >= x.sets ? "done" : ""}" ${x.skip ? 'style="opacity:.5"' : ""}><div class="row between"><a class="nm" href="#/ex/${x.it.e}" style="color:var(--ink);text-decoration:none">${esc(x.ex ? x.ex.n : x.it.e)} ›</a>${x.it.extra ? pill("ek gelişim", "acc") : ""}</div>
        <div class="small muted">${x.skip ? `<s>${exDose(x.it)}</s> — ${esc(x.skip)}` : exDose(Object.assign({}, x.it, {s: x.sets})) + " · " + esc(x.it.rpe || "")}</div>${x.it.note ? `<div class="tiny" style="color:var(--info)">${esc(x.it.note)}</div>` : ""}
        ${!x.skip && !finished ? `<div class="sets">${Array.from({length: x.sets}, (_, k) => `<button class="setb ${k < dn ? "on" : ""}" data-act="setTap" data-id="${log.id}" data-k="${x.key}" data-n="${k + 1}" data-rest="${x.it.rest || 0}" aria-label="Set ${k + 1}">${k + 1}</button>`).join("")}</div>` : ""}</div>`; }).join("")}
    ${finished ? logSummary(log) : `<div class="btns"><button class="btn danger" data-act="painReport" data-id="${log.id}">Ağrı / sorun bildir</button><button class="btn pri" data-act="finishSess" data-id="${log.id}">Antrenmanı bitir</button></div>`}`};
});
function logSummary(l) {
  return `<div class="card mt"><h3>Seans kaydı</h3><dl class="kv"><dt>Durum</dt><dd>${esc(l.status)}</dd><dt>Hazır oluş</dt><dd>${esc(l.readiness)}</dd><dt>Uyku</dt><dd>${isNum(l.sleep) ? l.sleep + " sa" : "—"}</dd>${isNum(l.duration) ? `<dt>Süre</dt><dd>${l.duration} dk</dd>` : ""}${isNum(l.rpe) ? `<dt>Zorluk (RPE)</dt><dd>${l.rpe}/10 — ${RPE_D[l.rpe]}</dd><dt>Seans yükü</dt><dd>${l.load} AU</dd>` : ""}${isNum(l.fatigue) ? `<dt>Antrenman sonrası yorgunluk</dt><dd>${l.fatigue}/5</dd>` : ""}<dt>Ağrı</dt><dd>${l.painLevel ? l.painLevel + "/10 " + esc(l.painArea || "") : "Yok"}</dd></dl>${l.notes ? `<p class="small">${esc(l.notes)}</p>` : ""}</div>`;
}
function wireSessionTimers(log) {
  const el = $("#sessT"); if (!el) return;
  const tick = () => { const ms = (log.endedAt || Date.now()) - log.startedAt; const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60; el.textContent = pad2(m) + ":" + pad2(s); };
  tick(); if (!log.endedAt) SESS.timer = setInterval(() => { if (!document.body.contains(el)) { clearInterval(SESS.timer); return; } tick(); }, 1000);
  if (SESS.restEnd > Date.now()) startRest();
}
function startRest() {
  clearInterval(SESS.rest);
  const box = $("#restBox"); if (!box) return;
  const draw = () => { const left = Math.ceil((SESS.restEnd - Date.now()) / 1000); if (!document.body.contains(box)) { clearInterval(SESS.rest); return; } if (left <= 0) { box.innerHTML = `<span class="pill ok">Hazır!</span>`; clearInterval(SESS.rest); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} beep(); return; } box.innerHTML = `<div class="tiny muted">Dinlenme</div><b style="font-size:1.25rem">${pad2(Math.floor(left / 60))}:${pad2(left % 60)}</b><div><button class="btn sm ghost" style="min-height:30px;padding:2px 8px" data-act="restAdd">+15</button><button class="btn sm ghost" style="min-height:30px;padding:2px 8px" data-act="restSkip">Atla</button></div>`; };
  draw(); SESS.rest = setInterval(draw, 500);

function beep() { try { const C = window.AudioContext || window.webkitAudioContext; const c = new C(); const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; o.connect(g); g.connect(c.destination); g.gain.value = .15; o.start(); o.stop(c.currentTime + .25); } catch (e) {} }
ACT.restAdd = () => { SESS.restEnd += 15000; startRest(); };
ACT.restSkip = () => { SESS.restEnd = 0; startRest(); };
ACT.pickReady = el => { const lab = el.closest("label"); $$(".ready button").forEach(b => b.classList.remove("on")); el.classList.add("on"); lab.querySelector("input").checked = true; };
document.addEventListener("change", e => { if (e.target.id === "painSel") $("#painBox").style.display = e.target.value === "1" ? "block" : "none"; });
FORM.ready = (d, f) => {
  const a = getA(f.dataset.aid), pid = f.dataset.pid, w = +f.dataset.w, dd = +f.dataset.d;
  const pain = d.pain === "1" ? num(d.painLevel) || 0 : 0;
  const log = {id: uid("l_"), key: logKey(pid, w, dd), athleteId: a.id, programId: pid, w, d: dd, date: todayISO(), readiness: d.readiness, sleep: num(d.sleep), painLevel: pain, painArea: pain ? d.painArea : "", startedAt: Date.now(), done: {}, status: "devam ediyor", mod: "normal", by: S.me.name};
  if (pain >= 4 || d.readiness === "Çok yorgun") {
    log.status = "durduruldu"; log.endedAt = Date.now();
    log.stopReason = pain >= 4 ? `Ağrı şiddeti ${pain}/10 (${d.painArea || "bölge belirtilmedi"}) bildirildi.` : "Çok yorgun hissettiğini bildirdin.";

    notify({key: "stop:" + log.id, athleteId: a.id, type: "health", title: pain >= 4 ? "Ağrı nedeniyle antrenman durduruldu" : "Çok yorgun — hafif seans", body: `${a.name}: ${log.stopReason}`, roles: ["coach", "parent"]});

};
ACT.setTap = el => {

ACT.painReport = el => {
  sheet(`<h2>Ağrı / sorun bildir</h2><form data-form="painRep" data-id="${el.dataset.id}">${field("Bölge", inp("area", "", "required"))}${field("Şiddet (0–10)", sel("lvl", Array.from({length: 11}, (_, i) => [String(i), String(i)]), "3"))}${field("Açıklama", `<textarea class="in" name="desc"></textarea>`)}

};
FORM.painRep = (d, f) => {
  const l = DB.logs.find(x => x.id === f.dataset.id), a = getA(l.athleteId), lvl = num(d.lvl) || 0;
  l.painLevel = Math.max(l.painLevel || 0, lvl); l.painArea = d.area; l.notes = ((l.notes || "") + " Ağrı: " + d.desc).trim();

ACT.painResolve = async el => { const l = DB.logs.find(x => x.id === el.dataset.id); if (!await confirmBox("Ağrı bildirimi antrenör/uzman tarafından değerlendirildi ve sporcu antrenmana devam edebilir mi?", "Onaylıyorum")) return; l.painResolved = {by: S.me.name, at: Date.now()}; audit("Ağrı bildirimi değerlendirildi", l.athleteId, ""); save(); reRender(); };
ACT.finishSess = el => {

    ${field("Antrenman sonrası yorgunluk", sel("fatigue", [["1", "1 — hiç yorgun değilim"], ["2", "2"], ["3", "3 — orta"], ["4", "4"], ["5", "5 — çok yorgunum"]], "3"))}
    ${field("Ağrı var mı? (0–10)", sel("pain", Array.from({length: 11}, (_, i) => [String(i), i ? String(i) : "0 — yok"]), String(l.painLevel || 0)))}${field("Ağrı bölgesi", inp("painArea", l.painArea || ""))}
    ${field("Notlar", `<textarea class="in" name="notes">${esc(l.notes || "")}</textarea>`)}<button class="btn pri block" type="submit">Kaydet</button></form>`);

ACT.pickRpe = el => { $$(".rpe button").forEach(b => b.classList.remove("on")); el.classList.add("on"); $("#rpeIn").value = el.dataset.v; $("#rpeD").textContent = RPE_D[+el.dataset.v]; };
FORM.finish = (d, f) => {
  const l = DB.logs.find(x => x.id === f.dataset.id), a = getA(l.athleteId), c = sessionCtx({pid: l.programId, w: l.w, d: l.d});
  const dur = num(d.duration); if (!isNum(dur) || dur < 1 || dur > 300) throw new Error("Süre 1–300 dk olmalı.");
  l.duration = Math.round(dur); l.rpe = num(d.rpe); l.fatigue = num(d.fatigue); l.painLevel = Math.max(l.painLevel || 0, num(d.pain) || 0); if (d.painArea) l.painArea = d.painArea; l.notes = d.notes;
  l.load = Math.round(l.rpe * l.duration); l.endedAt = Date.now();
  const items = c ? adaptedItems(c.s, l).filter(x => !x.skip) : [];
  const tot = items.reduce((n, x) => n + x.sets, 0), dn = items.reduce((n, x) => n + Math.min(x.sets, l.done[x.key] || 0), 0);
  l.completion = tot ? Math.round(dn / tot * 100) : 0;
  l.status = l.completion >= 70 ? "tamamlandı" : "kısmi";
  if (l.painLevel >= 4) { l.status = "durduruldu"; l.stopReason = `Seans sonunda ${l.painLevel}/10 ağrı bildirildi.`; }
  if (l.painLevel > 0 || l.rpe >= 9) notify({key: "fin:" + l.id, athleteId: a.id, type: "load", title: l.painLevel > 0 ? "Seans sonrası ağrı bildirimi" : "Çok yüksek algılanan zorluk", body: `${a.name}: RPE ${l.rpe}, ağrı ${l.painLevel}/10 ${l.painArea || ""}`, roles: ["coach", "parent"]});
  if (l.status === "tamamlandı") { const n = DB.logs.filter(x => x.athleteId === a.id && x.status === "tamamlandı").length; if ([1, 10, 25, 50].includes(n)) notify({key: "ms:" + a.id + ":" + n, athleteId: a.id, type: "milestone", title: `${n}. antrenman tamamlandı 🎉`, body: `${a.name} kendi hedeflerine doğru ilerliyor.`}); }

};

ACT.integrateExtra = el => {
  const pr = DB.programs.find(x => x.id === el.dataset.pid), a = getA(pr.athleteId), cw = Math.max(1, currentWeek(pr));
  const r = generateProgram(a, {sport: pr.sport, pos: pr.pos, weeks: pr.weeks, spw: pr.spw, minutes: pr.minutes, env: pr.env, eq: pr.eq, space: pr.space, days: pr.days, startDate: pr.startDate, seasonAware: pr.seasonAware, testInterval: pr.testInterval, includeExtra: true, type: pr.type, focusQ: pr.focusQ});

  pr.changes.push({at: Date.now(), by: S.me.name, what: `Ek gelişim çalışmaları hafta ${cw + 1}+ entegre edildi (yük nötr)`, reason: "Ek gelişim modülü önerisi"});

function vaContentRect(v, c) { const W = c.width, H = c.height, vw = v.videoWidth || W, vh = v.videoHeight || H, sc = Math.min(W / vw, H / vh); const w = vw * sc, h = vh * sc; return {x: (W - w) / 2, y: (H - h) / 2, w, h}; }
