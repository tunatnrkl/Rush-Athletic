<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1426">
<meta name="description" content="Rush Athletic — çocuk ve gençler için atletik performans, yetenek keşfi ve sporcu gelişim platformu">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rush Athletic">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Rush Athletic</title>
<style>
:root{
  --bg:#0B1426; --bg2:#0F1A30; --card:#141E34; --card2:#1A2540; --line:#26324D; --line2:#33405F;
  --ink:#F4F7FB; --ink2:#B9C3D6; --ink3:#8391AB;
  --acc:#22D3C5; --acc2:#3B82F6; --accInk:#04201D;
  --ok:#34D399; --warn:#FBBF24; --bad:#F87171; --info:#60A5FA;
  --okBg:rgba(52,211,153,.12); --warnBg:rgba(251,191,36,.12); --badBg:rgba(248,113,113,.12); --infoBg:rgba(96,165,250,.12); --accBg:rgba(34,211,197,.12);
  --r:16px; --r2:12px; --pad:16px;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  --fs:16px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EEF2F8; --bg2:#E4EAF3; --card:#FFFFFF; --card2:#F3F6FB; --line:#D8E0EC; --line2:#C5D0E0;
  --ink:#0B1426; --ink2:#3A4760; --ink3:#66738C; --accInk:#FFFFFF; --acc:#0E9F94; --acc2:#2563EB;
  --okBg:rgba(5,150,105,.12); --ok:#059669; --warn:#B45309; --warnBg:rgba(217,119,6,.12); --bad:#DC2626; --badBg:rgba(220,38,38,.10); --info:#2563EB; --infoBg:rgba(37,99,235,.10); --accBg:rgba(14,159,148,.12);
  color-scheme:light;
}
:root[data-text="large"]{--fs:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:var(--fs);line-height:1.45;-webkit-text-size-adjust:100%;overflow-x:hidden}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--bg)}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg),rgba(11,20,38,.96));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(var(--safeT) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
:root[data-theme="light"] .topbar{background:rgba(238,242,248,.96)}
.topbar h1{font-size:1.06rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;letter-spacing:.2px}
svg.i{width:22px;height:22px;flex:0 0 auto;vertical-align:middle}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;position:relative}
.iconbtn svg{width:22px;height:22px}
.dot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--card)}
.saveind{font-size:.72rem;color:var(--ink3);white-space:nowrap}
main{padding:14px var(--pad) calc(96px + var(--safeB))}
main.noNav{padding-bottom:calc(32px + var(--safeB))}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:30;background:rgba(15,26,48,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + var(--safeB))}
:root[data-theme="light"] .tabbar{background:rgba(255,255,255,.97)}
.tab{text-decoration:none;flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--ink3);font-size:.68rem;cursor:pointer;border-radius:10px;min-height:52px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--acc)}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
h2{font-size:1.18rem;margin:18px 0 10px}
h3{font-size:1rem;margin:14px 0 8px}
h2:first-child,h3:first-child{margin-top:0}
p{margin:6px 0}
.muted{color:var(--ink3)} .small{font-size:.82rem} .tiny{font-size:.72rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.card.flat{background:var(--card2)}
.card.acc{border-color:rgba(34,211,197,.45);background:linear-gradient(160deg,rgba(34,211,197,.10),var(--card) 60%)}
.card h3{margin-top:0}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;min-width:0}
.stat b{display:block;font-size:1.25rem;line-height:1.2}
.stat span{font-size:.74rem;color:var(--ink3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;text-align:center;max-width:100%}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btn.blue{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn.danger{background:var(--badBg);border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.88rem;border-radius:11px}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1 1 140px}
label.f{display:block;margin:0 0 12px}
label.f>span{display:block;font-size:.84rem;color:var(--ink2);margin-bottom:5px;font-weight:600}
.in,select.in,textarea.in{width:100%;min-height:48px;padding:11px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea.in{min-height:84px;resize:vertical}
.in:focus{border-color:var(--acc)}
.hint{font-size:.76rem;color:var(--ink3);margin-top:4px}
.grid2>*,.grid3>*{min-width:0}
input.in[type=date]{min-width:0;display:block}
.tbl .pill{white-space:normal}
.tbl td{overflow-wrap:anywhere}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;cursor:pointer}
.check input{width:22px;height:22px;flex:0 0 22px;margin:1px 0 0;accent-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card2);font-size:.86rem;cursor:pointer;user-select:none}
.chip input{display:none}
.chip.on,.chip:has(input:checked){background:var(--accBg);border-color:var(--acc);color:var(--acc)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;border:1px solid var(--line2);background:var(--card2);color:var(--ink2);max-width:100%;vertical-align:middle}
.pill.ok{background:var(--okBg);border-color:transparent;color:var(--ok)}
.pill.warn{background:var(--warnBg);border-color:transparent;color:var(--warn)}
.pill.bad{background:var(--badBg);border-color:transparent;color:var(--bad)}
.pill.info{background:var(--infoBg);border-color:transparent;color:var(--info)}
.pill.acc{background:var(--accBg);border-color:transparent;color:var(--acc)}
.alert{border-radius:var(--r2);padding:11px 12px;margin:0 0 12px;font-size:.88rem;border:1px solid transparent}
.alert.ok{background:var(--okBg);border-color:rgba(52,211,153,.35)}
.alert.warn{background:var(--warnBg);border-color:rgba(251,191,36,.35)}
.alert.bad{background:var(--badBg);border-color:rgba(248,113,113,.4)}
.alert.info{background:var(--infoBg);border-color:rgba(96,165,250,.35)}
.alert b.at{display:block;margin-bottom:2px}
.list{display:flex;flex-direction:column;gap:8px}
.li{text-decoration:none;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px;cursor:pointer;min-height:56px;text-decoration:none;color:inherit}
.li .ic{width:40px;height:40px;border-radius:11px;background:var(--accBg);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:0 0 40px;font-weight:800}
.li .ic svg{width:22px;height:22px}
.li .t{font-weight:650}
.li .s{font-size:.8rem;color:var(--ink3)}
.li .chev{color:var(--ink3);flex:0 0 auto}
.menuGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mtile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.76rem;cursor:pointer;min-height:86px;color:var(--ink);text-decoration:none}
.mtile svg{width:26px;height:26px;color:var(--acc)}
.avatar{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04201D;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.25rem;flex:0 0 auto}
.avatar.sm{width:40px;height:40px;border-radius:12px;font-size:.95rem;flex-basis:40px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.tbl{width:100%;border-collapse:collapse;font-size:.84rem}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{color:var(--ink3);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.3px}
.tbl td.r,.tbl th.r{text-align:right}
.tblwrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;min-height:40px;border:0;background:none;border-radius:9px;font-size:.84rem;font-weight:600;color:var(--ink3);cursor:pointer;padding:4px}
.seg button.on{background:var(--acc);color:var(--accInk)}
.seg a{flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:.84rem;font-weight:600;color:var(--ink3);text-decoration:none;padding:4px;text-align:center}
.seg a.on{background:var(--acc);color:var(--accInk)}
.codebox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:2.4rem;font-weight:800;letter-spacing:6px;color:var(--acc);margin:14px 0;user-select:all}
.codebox span{color:var(--ink3);margin:0 4px}
.codein{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.6rem!important;letter-spacing:5px;text-align:center;text-transform:uppercase}
a.stat:active,a.li:active,.btn:active{transform:scale(.98)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink2);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.ex{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;background:var(--card)}
.ex.done{border-color:rgba(52,211,153,.5);background:linear-gradient(150deg,var(--okBg),var(--card) 70%)}
.ex .nm{font-weight:700}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.setb{min-width:46px;height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);font-weight:700;cursor:pointer}
.setb.on{background:var(--ok);border-color:var(--ok);color:#052e1f}
.blockh{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-size:.8rem;font-weight:800;color:var(--acc);text-transform:uppercase;letter-spacing:.6px}
.blockh:after{content:"";flex:1;height:1px;background:var(--line)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:74px;padding:5px 3px;font-size:.66rem;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center}
.day b{font-size:.8rem}
.day.today{border-color:var(--acc)}
.day .ev{width:100%;border-radius:5px;padding:2px 1px;font-weight:700;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.s{background:var(--accBg);color:var(--acc)} .ev.t{background:var(--infoBg);color:var(--info)} .ev.c{background:var(--warnBg);color:var(--warn)} .ev.d{background:var(--okBg);color:var(--ok)}
.timer{font-variant-numeric:tabular-nums;font-size:2.2rem;font-weight:800;text-align:center;letter-spacing:1px}
.ready{display:grid;grid-template-columns:1fr;gap:8px}
.ready button{min-height:52px;border-radius:14px;border:1px solid var(--line2);background:var(--card2);font-weight:650;cursor:pointer;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:1rem}
.ready button.on{border-color:var(--acc);background:var(--accBg)}
.emoji{font-size:1.4rem}
.rpe{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rpe button{min-height:46px;border-radius:11px;border:1px solid var(--line2);background:var(--card2);font-weight:800;cursor:pointer}
.rpe button.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.vwrap{position:relative;width:100%;background:#000;border-radius:14px;overflow:hidden;touch-action:none}
.vwrap video{width:100%;display:block;max-height:60vh;object-fit:contain}
.vwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at 50% 35%,#16305A 0%,#0B1426 62%);transition:opacity .45s}
.splash.hide{opacity:0;pointer-events:none}
.logo{width:88px;height:88px}
.brand{font-size:1.7rem;font-weight:800;letter-spacing:.5px}
.brand em{font-style:normal;color:var(--acc)}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safeB));transform:translateX(-50%);z-index:90;background:#0E1B33;color:#fff;border:1px solid var(--line2);padding:11px 16px;border-radius:12px;font-size:.88rem;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
.sheetbg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:88vh;max-height:88dvh;overflow:auto;background:var(--bg2);border-radius:20px 20px 0 0;padding:18px var(--pad) calc(20px + var(--safeB));border-top:1px solid var(--line2)}
.sheet h2{margin-top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.88rem}
.kv dt{color:var(--ink3)} .kv dd{margin:0;text-align:right;font-weight:600;min-width:0;overflow-wrap:anywhere}
.ring{width:84px;height:84px;flex:0 0 84px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;width:84px;text-align:center;font-size:.7rem;color:var(--ink2)}
.badge .b{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;background:var(--accBg);border:2px solid var(--acc)}
.badge.off .b{filter:grayscale(1);opacity:.35;border-color:var(--line2)}
.hr{height:1px;background:var(--line);margin:14px 0}
.center{text-align:center}
.mt{margin-top:12px}.mb0{margin-bottom:0}
.nowrap{white-space:nowrap}
.scorebar{display:flex;align-items:center;gap:8px;font-size:.82rem;margin:6px 0}
.scorebar .lab{width:110px;flex:0 0 110px;color:var(--ink2)}
.scorebar .bar{flex:1}
.scorebar .v{width:44px;text-align:right;font-weight:700}
details.acc{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px}
details.acc>summary{padding:12px;cursor:pointer;font-weight:650;list-style:none;display:flex;align-items:center;gap:8px;min-height:48px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary:after{content:"›";margin-left:auto;transform:rotate(90deg);color:var(--ink3);font-size:1.3rem;transition:transform .2s}
details.acc[open]>summary:after{transform:rotate(-90deg)}
details.acc>div{padding:0 12px 12px}
.lock{max-width:420px;margin:0 auto;padding:calc(var(--safeT) + 40px) 20px 40px}
.empty{text-align:center;padding:26px 10px;color:var(--ink3)}
.empty svg{width:44px;height:44px;opacity:.6}
#printArea{display:none}
#repPrev .chart text{fill:#333}
#repPrev a{color:#0E9F94}
@media print{
  body{background:#fff!important;color:#111!important}
  #app,.toast,.sheetbg,.splash{display:none!important}
  #printArea{display:block!important;color:#111;font-size:11pt}
  #printArea .pcard{border:1px solid #ccd;border-radius:8px;padding:10px;margin:0 0 10px;break-inside:avoid}
  #printArea h1{font-size:18pt;margin:0 0 4px}
  #printArea h2{font-size:13pt;margin:14px 0 6px;color:#0B1426;border-bottom:2px solid #22D3C5;padding-bottom:3px}
  #printArea table{width:100%;border-collapse:collapse;font-size:9.5pt}
  #printArea th,#printArea td{border-bottom:1px solid #dde;padding:4px;text-align:left}
  #printArea svg text{fill:#333}
  @page{margin:14mm}
}
@media (min-width:521px){ body{background:#070D1A} #app{box-shadow:0 0 0 1px var(--line)} }
</style>
</head>
<body>
<div id="splash" class="splash" aria-hidden="true">
  <svg class="logo" viewBox="0 0 96 96" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3C5"/></linearGradient></defs><rect x="4" y="4" width="88" height="88" rx="24" fill="#0F1A30" stroke="url(#lg)" stroke-width="3"/><path d="M26 64 L42 30 L54 52 L62 40 L72 64" fill="none" stroke="url(#lg)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="62" cy="26" r="6" fill="#22D3C5"/></svg>
  <div class="brand">RUSH <em>ATHLETIC</em></div>
  <div class="muted small">Atletik performans · Yetenek keşfi · Gelişim</div>
</div>
<div id="app"></div>
<div id="printArea"></div>
<div id="toastHost"></div>
<div id="sheetHost"></div>
<script src="config.js"></script>
<script>
"use strict";

/* ===== data.js ===== */
/* =========================================================================
   RUSH ATHLETIC — MODÜLER KATALOGLAR (testler, egzersizler, branşlar, sağlık)
   Yeni branş / test / egzersiz eklemek için yalnızca bu dizilere kayıt eklenir.
   ========================================================================= */
const APP_VERSION = "1.0.0";
const ENGINE_VERSION = "kural-tabanlı motor v1.0";

const QUALITIES = [
  {k:"str", n:"Kuvvet"}, {k:"pow", n:"Patlayıcı kuvvet"}, {k:"spd", n:"Sürat"},
  {k:"agi", n:"Çeviklik"}, {k:"end", n:"Dayanıklılık"}, {k:"coo", n:"Koordinasyon"},
  {k:"bal", n:"Denge"}, {k:"mob", n:"Mobilite"}, {k:"rea", n:"Reaksiyon"}
];
const QN = Object.fromEntries(QUALITIES.map(q => [q.k, q.n]));
const FEAT_N = Object.assign({H:"Boy (yaşa göre)", AS:"Kol açıklığı / boy", M:"Vücut kütlesi (boya göre)"}, QN);

/* Hareket kısıtlama etiketleri — sağlık kayıtlarından gelir, egzersiz/test filtresinde kullanılır */

function normCdf(z) { const t = 1 / (1 + 0.2316419 * Math.abs(z)); const d = 0.3989423 * Math.exp(-z * z / 2); let p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; }
function seeded(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const sd = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) * (x - m), 0) / (a.length - 1)); };
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); const k = s.length >> 1; return s.length % 2 ? s[k] : (s[k - 1] + s[k]) / 2; };

/* ---------- IndexedDB (yalnızca bu cihazdaki egzersiz demo videoları) ---------- */
function idb() { return new Promise((res, rej) => { const r = indexedDB.open("rush-media", 2); r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains("blobs")) r.result.createObjectStore("blobs"); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbPut(key, val) { const d = await idb(); return new Promise((res, rej) => { const t = d.transaction("blobs", "readwrite"); t.objectStore("blobs").put(val, key); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
async function idbGet(key) { const d = await idb(); return new Promise((res, rej) => { const t = d.transaction("blobs", "readonly"); const q = t.objectStore("blobs").get(key); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbDel(key) { try { const d = await idb(); await new Promise(res => { const t = d.transaction("blobs", "readwrite"); t.objectStore("blobs").delete(key); t.oncomplete = res; t.onerror = res; }); } catch (e) {} }
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };

function download(name, text, type = "application/json") {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function formData(form) {
  const o = {};
  for (const el of form.elements) {
    if (!el.name) continue;
    if (el.type === "checkbox") { if (el.dataset.multi) { (o[el.name] = o[el.name] || []); if (el.checked) o[el.name].push(el.value); } else o[el.name] = el.checked; }
    else if (el.type === "radio") { if (el.checked) o[el.name] = el.value; }
    else o[el.name] = el.value;
  }
  return o;
}

/* =========================================================================
   VERİ KATMANI — aynı arayüzle iki mod:
   * CloudAPI : Supabase (config.js doluysa). Farklı telefonlar arasında kodla bağlanma.
   * LocalAPI : Deneme modu — tüm hesaplar bu cihazda. Kurulum gerektirmez.

const CFG = (typeof window !== "undefined" && window.RUSH_CONFIG) || {};
const CLOUD_ON = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
const USER_DOMAIN = "kullanici.rushathletic.app";
function toEmail(u) { u = String(u || "").trim().toLowerCase(); if (u.includes("@")) return u; const s = u.replace(/ı/g, "i").replace(/ğ/g, "g").replace(/ü/g, "u").replace(/ş/g, "s").replace(/ö/g, "o").replace(/ç/g, "c").replace(/[^a-z0-9._-]/g, ""); if (s.length < 3) throw new Error("Kullanıcı adı en az 3 harf/rakam olmalı."); return s + "@" + USER_DOMAIN; }
const showLogin = email => String(email || "").endsWith("@" + USER_DOMAIN) ? email.split("@")[0] : email;
const CODE_ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const normCode = c => String(c || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
function newCode() { const r = crypto.getRandomValues(new Uint8Array(6)); return Array.from(r, x => CODE_ALPHA[x % CODE_ALPHA.length]).join(""); }

/* ---------------- Yerel (deneme) mod ---------------- */
const LocalAPI = (() => {
  const KEY = "rush2.local", SKEY = "rush2.session";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } };
  let D = load() || {users: [], profiles: {}, athletes: [], links: [], coachDocs: {}};
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { throw new Error("Cihaz depolama alanı dolu."); } };
  let uid = null; try { uid = (JSON.parse(localStorage.getItem(SKEY)) || {}).uid || null; } catch (e) {}
  const me = () => D.users.find(u => u.id === uid) || null;
  const need = () => { if (!me()) throw new Error("Oturum gerekli."); return uid; };
  const role = () => (D.profiles[uid] || {}).role;
  async function hash(pw, salt) {
    const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    const b = await crypto.subtle.deriveBits({name: "PBKDF2", salt: new TextEncoder().encode(salt), iterations: 60000, hash: "SHA-256"}, k, 256);
    return Array.from(new Uint8Array(b), x => x.toString(16).padStart(2, "0")).join("");
  }
  const uniqCode = () => { let c; do { c = newCode(); } while (D.athletes.some(a => a.invite_code === c || a.parent_code === c)); return c; };
  const canRead = a => a.coach_id === uid || a.athlete_user_id === uid || D.links.some(l => l.athlete_id === a.id && l.parent_id === uid);
  const clone = o => JSON.parse(JSON.stringify(o));
  return {
    mode: "local", label: "Deneme modu (tek cihaz)",
    reload() { D = load() || D; },
    async restore() { this.reload(); return me() ? {id: uid, email: me().email} : null; },
    user() { return me() ? {id: uid, email: me().email} : null; },
    async signUp(email, pw) {
      this.reload(); email = email.toLowerCase();
      if (D.users.some(u => u.email === email)) throw new Error("Bu kullanıcı adı / e-posta zaten kayıtlı.");
      const salt = newCode() + Date.now(); const u = {id: crypto.randomUUID ? crypto.randomUUID() : uid4(), email, salt, hash: await hash(pw, salt)};
      D.users.push(u); persist(); uid = u.id; localStorage.setItem(SKEY, JSON.stringify({uid})); return {id: uid, email};
    },
    async signIn(email, pw) {
      this.reload(); email = email.toLowerCase(); const u = D.users.find(x => x.email === email);
      if (!u || (await hash(pw, u.salt)) !== u.hash) throw new Error("Kullanıcı adı/e-posta veya şifre hatalı.");
      uid = u.id; localStorage.setItem(SKEY, JSON.stringify({uid})); return {id: uid, email};
    },
    async signOut() { uid = null; localStorage.removeItem(SKEY); },
    async changePassword(pw) { need(); const u = me(); u.salt = newCode() + Date.now(); u.hash = await hash(pw, u.salt); persist(); },
    async profile() { this.reload(); const p = D.profiles[uid]; return p ? Object.assign({id: uid}, p) : null; },
    async setProfile(r, name) { need(); const p = D.profiles[uid]; if (p) { if (name) p.name = name; } else D.profiles[uid] = {role: r, name: name || ""}; persist(); return this.profile(); },
    async createInvite(note) {
      need(); if (role() !== "coach") throw new Error("Yalnızca antrenör öğrenci ekleyebilir.");
      const a = {id: crypto.randomUUID ? crypto.randomUUID() : uid4(), coach_id: uid, coach_name: D.profiles[uid].name, athlete_user_id: null, invite_code: uniqCode(), invite_note: (note || "").trim(), parent_code: null, info: {}, coach: {}, logs: {}, created_at: new Date().toISOString(), updated_at: new Date().toISOString()};
      D.athletes.push(a); persist(); return {athlete_id: a.id, code: a.invite_code};
    },
    async inviteInfo(code) { this.reload(); const a = D.athletes.find(x => x.invite_code === normCode(code) && !x.athlete_user_id); return a ? {coach_name: a.coach_name, note: a.invite_note} : null; },
    async redeemInvite(code) {
      need(); if (role() !== "athlete") throw new Error("Bu kod yalnızca öğrenci hesabıyla kullanılabilir.");
      if (D.athletes.some(a => a.athlete_user_id === uid)) throw new Error("Bu hesap zaten bir antrenöre bağlı.");
      const a = D.athletes.find(x => x.invite_code === normCode(code) && !x.athlete_user_id); if (!a) throw new Error("Kod geçersiz veya daha önce kullanılmış.");
      a.athlete_user_id = uid; a.invite_code = null; persist(); return a.id;
    },
    async createParentCode(aid) { need(); const a = D.athletes.find(x => x.id === aid && x.athlete_user_id === uid); if (!a) throw new Error("Veli kodunu yalnızca öğrenci oluşturabilir."); a.parent_code = uniqCode(); persist(); return a.parent_code; },
    async parentCodeInfo(code) { this.reload(); const a = D.athletes.find(x => x.parent_code === normCode(code)); return a ? {athlete_name: a.info.name || "", coach_name: a.coach_name} : null; },
    async redeemParentCode(code) {
      need(); if (role() !== "parent") throw new Error("Bu kod yalnızca veli hesabıyla kullanılabilir.");
      const a = D.athletes.find(x => x.parent_code === normCode(code)); if (!a) throw new Error("Veli kodu geçersiz.");
      if (!D.links.some(l => l.athlete_id === a.id && l.parent_id === uid)) D.links.push({athlete_id: a.id, parent_id: uid, parent_name: D.profiles[uid].name, created_at: new Date().toISOString()});
      persist(); return a.id;
    },
    async athleteParents(aid) { const a = D.athletes.find(x => x.id === aid && (x.athlete_user_id === uid || x.coach_id === uid)); if (!a) return []; return D.links.filter(l => l.athlete_id === aid).map(l => ({parent_id: l.parent_id, name: l.parent_name, created_at: l.created_at})); },
    async removeParent(aid, pid) { const a = D.athletes.find(x => x.id === aid && (x.athlete_user_id === uid || x.coach_id === uid)); if (!a) throw new Error("Yetki yok."); D.links = D.links.filter(l => !(l.athlete_id === aid && l.parent_id === pid)); persist(); },
    async listAthletes() { this.reload(); need(); return clone(D.athletes.filter(canRead)); },
    async saveInfo(aid, data) { need(); const a = D.athletes.find(x => x.id === aid && x.athlete_user_id === uid); if (!a) throw new Error("Kişisel bilgileri yalnızca öğrencinin kendisi değiştirebilir."); a.info = clone(data); a.updated_at = new Date().toISOString(); persist(); },
    async saveLogs(aid, data) { need(); const a = D.athletes.find(x => x.id === aid && x.athlete_user_id === uid); if (!a) throw new Error("Antrenman kayıtlarını yalnızca öğrenci girebilir."); a.logs = clone(data); a.updated_at = new Date().toISOString(); persist(); },
    async saveCoach(aid, data) { need(); const a = D.athletes.find(x => x.id === aid && x.coach_id === uid); if (!a) throw new Error("Ölçüm, test ve programları yalnızca antrenör girebilir."); a.coach = clone(data); a.updated_at = new Date().toISOString(); persist(); },
    async deleteAthlete(aid) { need(); const n = D.athletes.length; D.athletes = D.athletes.filter(x => !(x.id === aid && x.coach_id === uid)); if (n === D.athletes.length) throw new Error("Yetki yok."); D.links = D.links.filter(l => l.athlete_id !== aid); persist(); },
    async getCoachDoc() { need(); return clone(D.coachDocs[uid] || {}); },
    async saveCoachDoc(data) { need(); if (role() !== "coach") throw new Error("Yetki yok."); D.coachDocs[uid] = clone(data); persist(); },
    async deleteAccount() {
      need(); const id = uid;
      D.athletes = D.athletes.filter(a => a.coach_id !== id); D.athletes.forEach(a => { if (a.athlete_user_id === id) a.athlete_user_id = null; });
      D.links = D.links.filter(l => l.parent_id !== id && D.athletes.some(a => a.id === l.athlete_id));
      delete D.profiles[id]; delete D.coachDocs[id]; D.users = D.users.filter(u => u.id !== id); persist(); await this.signOut();
    },
    _wipe() { D = {users: [], profiles: {}, athletes: [], links: [], coachDocs: {}}; persist(); this.signOut(); },
    _raw() { return D; }
  };
})();
function uid4() { return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)); }

/* ---------------- Bulut (Supabase) mod ---------------- */
const CloudAPI = (() => {
  const URL0 = String(CFG.supabaseUrl || "").replace(/\/+$/, ""), KEY = CFG.supabaseAnonKey, SKEY = "rush2.cloudsession";
  let S = null; try { S = JSON.parse(localStorage.getItem(SKEY)); } catch (e) {}
  const setS = s => { S = s; if (s) localStorage.setItem(SKEY, JSON.stringify(s)); else localStorage.removeItem(SKEY); };
  const sessFrom = j => ({access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), user: {id: j.user.id, email: j.user.email}});
  async function req(path, opt = {}, auth = true) {
    const h = Object.assign({apikey: KEY, "Content-Type": "application/json"}, opt.headers || {});
    if (auth && S) { if (S.expires_at - 60 < Date.now() / 1000) await refresh(); h.Authorization = "Bearer " + S.access_token; } else h.Authorization = "Bearer " + KEY;
    let r;
    try { r = await fetch(URL0 + path, Object.assign({}, opt, {headers: h})); }
    catch (e) { throw new Error("Sunucuya bağlanılamadı. İnternet bağlantınızı kontrol edin."); }
    const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) { j = txt; }
    if (!r.ok) { const m = (j && (j.message || j.msg || j.error_description || j.error)) || ("HTTP " + r.status); throw new Error(trMsg(m)); }
    return j;
  }
  function trMsg(m) {
    if (/Invalid login credentials/i.test(m)) return "Kullanıcı adı/e-posta veya şifre hatalı.";
    if (/already registered|already exists/i.test(m)) return "Bu kullanıcı adı / e-posta zaten kayıtlı.";
    if (/Password should be at least/i.test(m)) return "Şifre en az 6 karakter olmalı.";
    if (/Email not confirmed/i.test(m)) return "E-posta doğrulanmamış. Supabase'de 'Confirm email' ayarını kapatın veya e-postadaki bağlantıya tıklayın.";
    if (/JWT expired/i.test(m)) return "Oturum süresi doldu, tekrar giriş yapın.";
    return m;
  }
  async function refresh() {
    if (!S || !S.refresh_token) return;
    const r = await fetch(URL0 + "/auth/v1/token?grant_type=refresh_token", {method: "POST", headers: {apikey: KEY, "Content-Type": "application/json"}, body: JSON.stringify({refresh_token: S.refresh_token})});
    if (!r.ok) { setS(null); throw new Error("Oturum süresi doldu, tekrar giriş yapın."); }
    setS(sessFrom(await r.json()));
  }
  const rpc = (fn, args) => req("/rest/v1/rpc/" + fn, {method: "POST", body: JSON.stringify(args || {})});
  return {
    mode: "cloud", label: "Bulut (tüm cihazlarda)",
    reload() {},
    async restore() { if (!S) return null; try { if (S.expires_at - 60 < Date.now() / 1000) await refresh(); return S ? S.user : null; } catch (e) { return null; } },
    user() { return S ? S.user : null; },
    async signUp(email, pw) {
      const j = await req("/auth/v1/signup", {method: "POST", body: JSON.stringify({email, password: pw})}, false);
      if (!j || !j.access_token) throw new Error("Hesap oluşturuldu ancak e-posta doğrulaması gerekiyor. Supabase'de Authentication > Providers > Email > 'Confirm email' kapatılmalı.");
      setS(sessFrom(j)); return S.user;
    },
    async signIn(email, pw) { const j = await req("/auth/v1/token?grant_type=password", {method: "POST", body: JSON.stringify({email, password: pw})}, false); setS(sessFrom(j)); return S.user; },
    async signOut() { try { if (S) await req("/auth/v1/logout", {method: "POST"}); } catch (e) {} setS(null); },
    async changePassword(pw) { await req("/auth/v1/user", {method: "PUT", body: JSON.stringify({password: pw})}); },
    async profile() { const r = await req("/rest/v1/profiles?select=*&id=eq." + S.user.id); return r && r[0] || null; },
    async setProfile(role, name) { return rpc("set_profile", {p_role: role, p_name: name || ""}); },
    createInvite: note => rpc("create_invite", {p_note: note || ""}),
    inviteInfo: code => rpc("invite_info", {p_code: normCode(code)}),
    redeemInvite: code => rpc("redeem_invite", {p_code: normCode(code)}),
    createParentCode: aid => rpc("create_parent_code", {p_aid: aid}),
    parentCodeInfo: code => rpc("parent_code_info", {p_code: normCode(code)}),
    redeemParentCode: code => rpc("redeem_parent_code", {p_code: normCode(code)}),
    athleteParents: aid => rpc("athlete_parents", {p_aid: aid}),
    removeParent: (aid, pid) => rpc("remove_parent", {p_aid: aid, p_parent: pid}),
    listAthletes: () => req("/rest/v1/athletes?select=*&order=created_at.asc"),
    saveInfo: (aid, d) => rpc("save_info", {p_aid: aid, p_data: d}),
    saveLogs: (aid, d) => rpc("save_logs", {p_aid: aid, p_data: d}),
    saveCoach: (aid, d) => rpc("save_coach", {p_aid: aid, p_data: d}),
    deleteAthlete: aid => rpc("delete_athlete", {p_aid: aid}),
    async getCoachDoc() { const r = await req("/rest/v1/coach_docs?select=data&coach_id=eq." + S.user.id); return (r && r[0] && r[0].data) || {}; },
    async saveCoachDoc(data) { await req("/rest/v1/coach_docs", {method: "POST", headers: {Prefer: "resolution=merge-duplicates,return=minimal"}, body: JSON.stringify({coach_id: S.user.id, data})}); },
    async deleteAccount() { await rpc("delete_my_account", {}); setS(null); }
  };
})();
const API = CLOUD_ON ? CloudAPI : LocalAPI;

/* ===== store.js ===== */
/* =========================================================================
   UYGULAMA DURUMU — sunucudaki satırları motorun kullandığı düz listelere çevirir,
   değişiklikleri doğru belgeye (öğrenci bilgisi / antrenör verisi / antrenman kaydı) geri yazar.
   ========================================================================= */

/* ---------------- Antropometri ---------------- */
const measOf = aid => DB.measurements.filter(m => m.athleteId === aid).sort((a, b) => a.date < b.date ? -1 : 1);
function anth(aid) {
  const r = {};
  for (const m of measOf(aid)) for (const k in m) if (m[k] !== null && m[k] !== "" && m[k] !== undefined && !["id", "athleteId"].includes(k)) r[k] = m[k];
  if (isNum(r.heightCm) && isNum(r.sittingHeightCm) && !isNum(r.legLengthCm)) r.legLengthCm = round(r.heightCm - r.sittingHeightCm, 1);

}

  for (const m of hs.slice(0, -1)) { const d = daysBetween(m.date, last.date); if (d >= 90) { if (!best || Math.abs(d - 365) < Math.abs(daysBetween(best.date, last.date) - 365)) best = m; } }

  const v = (last.heightCm - best.heightCm) / days * 365.25;
  return {v: round(v, 1), from: best.date, to: last.date, days, rapid: v >= 7.5, note: v >= 7.5 ? "Hızlı büyüme dönemi göstergesi (≥7,5 cm/yıl): sıçrama, sprint ve yük hacmi dikkatle yönetilmeli." : "Büyüme hızı olağan aralıkta görünüyor."};
}
function maturity(a) {

/* ---------------- Test puanlama ---------------- */
function normFor(t, age, sx) {
  if (!t.nm || !isNum(age)) return null;
  const arr = t.nm[sx]; const a = clamp(age, 6, 18);
  let m;
  if (a <= 12) m = arr[0] + (arr[1] - arr[0]) * (a - 8) / 4;
  else if (a <= 16) m = arr[1] + (arr[2] - arr[1]) * (a - 12) / 4;
  else m = arr[2] + (arr[2] - arr[1]) * (a - 16) / 8;

  return {mean: m, sd: s};
}
function testValue(r) { if (isNum(r.value)) return r.value; if (isNum(r.left) && isNum(r.right)) return (r.left + r.right) / 2; return isNum(r.left) ? r.left : r.right; }

function asym(t, r) {
  if (!t.bil || !isNum(r.left) || !isNum(r.right)) return null;
  const absT = {shoulder: 5, ankle: 2, sitreach: 4}[t.id];
  const diff = Math.abs(r.left - r.right);
  if (absT) return {abs: round(diff, 1), flag: diff > absT, txt: `${fmtN(diff, 1)} ${t.u} fark`};
  const best = t.lb ? Math.min(r.left, r.right) : Math.max(r.left, r.right);
  const pct = best ? diff / Math.abs(best) * 100 : 0;
  const weaker = (t.lb ? r.left > r.right : r.left < r.right) ? "Sol" : "Sağ";
  return {pct: round(pct, 1), flag: pct > 10, high: pct > 15, weaker, txt: `%${fmtN(pct, 1)} (${weaker} taraf zayıf)`};
}
const testsOf = (aid, tid) => DB.tests.filter(r => r.athleteId === aid && (!tid || r.testId === tid)).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.at - b.at);
function scoreResult(a, r) { const t = TEST[r.testId]; return pctScore(t, testValue(r), ageAt(a.birthDate, r.date), sexKey(a)); }
function qualityScores(a, which = "latest") {
  const out = {};
  const all = testsOf(a.id);
  const lastDate = all.length ? all[all.length - 1].date : null;
  for (const q of QUALITIES) {
    const items = [];
    for (const t of TESTS.filter(t => t.q === q.k)) {
      const rs = testsOf(a.id, t.id); if (!rs.length) continue;
      let r = which === "latest" ? rs[rs.length - 1] : rs.length > 1 ? rs[rs.length - 2] : null;
      if (!r) continue;
      if (which === "latest" && lastDate && daysBetween(r.date, lastDate) > 365) continue;
      const sc = scoreResult(a, r);
      items.push({id: t.id, n: t.n, score: sc, value: testValue(r), date: r.date});
    }
    const scored = items.filter(i => isNum(i.score));
    out[q.k] = {score: scored.length ? Math.round(mean(scored.map(i => i.score))) : null, items, hasData: items.length > 0};

}
function targetScores(a, cur) { const t = {}; for (const q of QUALITIES) { const c = cur[q.k].score; t[q.k] = a.targets && isNum(a.targets[q.k]) ? a.targets[q.k] : isNum(c) ? Math.min(95, c + 8) : null; } return t; }
function teOf(t, v) { return isNum(t.te) ? t.te : (t.cv || 5) / 100 * Math.abs(v || 1); }
function compareResults(t, r1, r2) {
  const v1 = testValue(r1), v2 = testValue(r2); if (!isNum(v1) || !isNum(v2)) return null;

  else if (ratio < 2) { verdict = improved ? "Olası gelişim — dikkatli yorumlayın" : "Olası gerileme — koşulları kontrol edin"; cls = improved ? "acc" : "warn"; }

function healthAdvice(aid) {

    if (h.cat === "sense") out.push("Görme/işitme kısıtlılığı: görsel/işitsel komutlar uyarlanmalı (ör. dokunsal veya görsel işaretler).");

/* ---------------- Yük takibi ---------------- */

  if (mono != null && mono > 2) flags.push({lv: "warn", t: `Monotoni yüksek (${fmtN(mono, 1)}): günler arası yük çeşitliliği azaltılmış; hafif/zor gün dengesi önerilir.`});

  if (pains.length >= 2) flags.push({lv: "bad", t: `Son 14 günde ${pains.length} ağrı bildirimi. Antrenör ve gerekirse sağlık uzmanı değerlendirmesi önerilir.`});

    ${Hh("Atletik profil")}<div style="max-width:330px;margin:0 auto">${radar}</div><div style="font-size:11px;color:#556;text-align:center">Turkuaz: şimdi · gri: önceki · turuncu: hedef</div>
    ${Hh("Test sonuçları")}<table ${tb}><tr><th ${td}>Test</th><th ${td}>İlk</th><th ${td}>Son</th><th ${td}>Değişim</th></tr>${tst.map(x => `<tr><td ${td}>${esc(x.t.n)} (${x.t.u})</td><td ${td}>${fmtN(testValue(x.f), x.t.dec)}</td><td ${td}><b>${fmtN(testValue(x.l), x.t.dec)}</b></td><td ${td} style="font-size:11px">${x.c ? (x.c.pct != null ? (x.c.pct > 0 ? "+" : "") + fmtN(x.c.pct, 1) + "% · " : "") + esc(x.c.verdict) : "tek ölçüm"}</td></tr>`).join("") || `<tr><td ${td}>Henüz test yok</td></tr>`}</table>
    ${tst.filter(x => x.rs.length >= 2).slice(0, 2).map(x => `<div style="margin-top:6px"><div style="font-size:12px;font-weight:700">${esc(x.t.n)}</div>${lineChart([{color: "#0E9F94", points: x.rs.map(r => ({x: r.date, y: testValue(r)}))}], {dec: x.t.dec, labels: true, h: 150}).replace(/var\(--line\)/g, "#dde")}</div>`).join("")}
    ${Hh("Güçlü yönler ve gelişim alanları")}<div style="font-size:12.5px"><b>Güçlü:</b> ${strengths.map(q => q.n).join(", ") || "—"}<br><b>Geliştirilecek:</b> ${devs.map(q => q.n).join(", ") || "—"}</div>
    ${vids.length ? Hh("Yapay zekâ hareket analizleri") + `<table ${tb}>${vids.map(v => `<tr><td ${td}>${fmtD(isoOf(new Date(v.at)))}</td><td ${td}>${esc(v.exId && exById(v.exId) ? exById(v.exId).n : v.typeName)}</td><td ${td}><b>${v.score}</b>/100</td><td ${td} style="font-size:11px">${esc(v.summary)}</td></tr>`).join("")}</table>` : ""}

    ${Hh("Antrenör değerlendirmesi")}<div style="font-size:12.5px">${note ? esc(note) + "<br>" : ""}${cms.map(c => `“${esc(c.text)}” — ${fmtD(isoOf(new Date(c.at)))}`).join("<br>") || (note ? "" : "—")}</div>
    <div style="font-size:10px;color:#778;margin-top:14px;border-top:1px solid #dde;padding-top:6px">Referans değerler yaklaşıktır. Bu rapor tıbbi teşhis içermez.</div></div>`;
}

  if (!as.length) throw new Error("Uygun öğrenci yok.");
  const restr = new Set(), notes = []; as.forEach(a => restrictions(a.id).forEach(t => restr.add(t)));
  const stages = as.map(a => devStage(a)), stage = Math.min(...stages.map(s => s.stage)), sp = sportById(d.sport);
  if (restr.size) notes.push("Grupta kaçınılan: " + [...restr].map(t => RTAGS[t]).join(", "));
  as.forEach((a, i) => { if (stages[i].gv && stages[i].gv.rapid) notes.push(`${a.name}: hızlı büyüme — sıçramaları yarıya indir.`); });
  const focus = d.focus ? [d.focus, relatedQ(d.focus)] : sp.focus.slice(0, 2);
  const s = buildSession({aid: g.id, stage, restr, eq: new Set(d.eq || []), space: !!d.space, growthRapid: stages.some(s => s.gv && s.gv.rapid), sport: sp, seed: d.date}, {minutes: +d.minutes, type: "main"}, {key: "spec", block: 0, wib: 0, mult: 1}, 0, focus, []);
  g.sessions = g.sessions || []; g.sessions.push(Object.assign({id: uid("gs_"), date: d.date, title: focus.map(q => QN[q]).join(" + "), notes}, s));
  saveCoachDoc(); reRender();
};
FORM.groupAtt = (d, f) => {
  const g = DB.groups.find(x => x.id === f.dataset.gid), s = g.sessions.find(x => x.id === f.dataset.sid); s.att = {};
  g.athleteIds.forEach(id => { if (d["att_" + id]) { s.att[id] = true; const rpe = num(d["rpe_" + id]); DB.extLoads.push({id: uid("x_"), athleteId: id, src: "coach", type: "Grup antrenmanı: " + g.name, date: s.date, duration: s.estMin, rpe, load: Math.round(rpe * s.estMin)}); saveAth(id, "coach"); } });
  saveCoachDoc(); toast("Katılım kaydedildi"); reRender();
};
FORM.groupProg = (d, f) => {
  const g = DB.groups.find(x => x.id === f.dataset.gid); let ok = 0; const skip = [];
  for (const id of g.athleteIds) {
    const a = getA(id); if (!a) continue;
    if (!a.birthDate) { skip.push(a.name + " (bilgi eksik)"); continue; }
    const r = generateProgram(a, {type: "main", sport: d.sport, pos: a.position || null, weeks: parseInt(d.weeks), spw: d.spw, minutes: parseInt(d.minutes), env: d.env, eq: d.eq || [], space: d.space, startDate: nextMonday(), testInterval: 4, includeExtra: true, seasonAware: true});
    if (!r.ok) { skip.push(a.name + " (sağlık onayı)"); continue; }
    DB.programs.filter(x => x.athleteId === id && x.type === "main" && x.status === "onaylı").forEach(x => x.status = "arşiv");
    DB.programs.push(Object.assign(r.program, {athleteId: id})); saveAth(id, "coach"); ok++;
  }
  sheet(`<h2>Programlar oluşturuldu</h2><p>${ok} öğrenciye program oluşturuldu.</p>${skip.length ? alertBox("warn", "Atlananlar", skip.map(esc).join("<br>")) : ""}<button class="btn pri block" data-act="closeSheet">Tamam</button>`);
};

function weekStreak(aid) { let st = 0; const w = mondayOf(todayISO()); for (let i = 1; i <= 52; i++) { const s = addDays(w, -7 * i); if (DB.logs.some(l => l.athleteId === aid && l.date >= s && l.date <= addDays(s, 6) && l.status === "tamamlandı")) st++; else break; } return st; }
